version: "3.8"
services:
  backend:
    build:
      context: .
    volumes:
      - ./src:/usr/src/app/src
      - ./tests:/usr/src/app/tests
    env_file:
      - .env
  nginx:
    image: nginx:alpine
    restart: always
    ports:
        - "80:80"
    volumes:
        - ./nginx/nginx.conf:/etc/nginx/nginx.conf
  
