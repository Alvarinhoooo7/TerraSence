                  - paragraph [ref=f14e73]: If you are spending much time in pecan orchards composed of Desirable and Pawnee trees right now, you can likely find at least a little scab on a few nuts here and there if you look hard enough. In some cases, you will find a lot more than you would like to see. Our wet…
