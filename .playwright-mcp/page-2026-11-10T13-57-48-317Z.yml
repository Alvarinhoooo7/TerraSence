      - article [ref=f19e59]:
        - paragraph [ref=f19e60]:
          - emphasis [ref=f19e61]: Nutrition of Florida Citrus Trees, 3rd Edition
          - text: is an update of UF/IFAS Bulletin SP169, which provided guidelines for Florida citrus fertilization since 1995. The objective of the original edition was to provide background information and recommendations to develop a sound citrus nutrition program that optimizes financial returns while sustaining yields and maintaining soil and water quality. The second edition maintained that objective as it incorporated the findings of numerous citrus nutrition research projects conducted since the mid-1990s.
        - paragraph [ref=f19e62]:
          - text: The information provided in the 2nd edition is still sound for healthy citrus trees under Florida production conditions. Much of the information provided in this document on nutrients, application methods, leaf and soil sampling, and irrigation scheduling are also effective for uanglongbing (HLB) affected citrus trees caused by
          - emphasis [ref=f19e63]: Candidatus
          - text: Liberibacter asiaticus (
          - emphasis [ref=f19e64]: C
          - text: Las). However, research conducted since HLB was detected in Florida in 2005 has established changes in many production practices including nutrient rates, irrigation scheduling, soil pH management, and use of Citrus Undercover Protective Screens (CUPS). On the PDF version, changes to the 2nd edition of SL253 will appear in colored boxes at the beginning of chapters 2, 6, 8, 9, and 11.
        - paragraph [ref=f19e65]: Supplemental information on subjects related to citrus nutrition appear in extensive appendices. Color plates depicting nutrient deficiencies and toxicities and a key to mineral deficiency symptoms in citrus are included to aid in visual analysis of tree nutritional status.
        - paragraph [ref=f19e66]:
          - text: A copy of
          - link [ref=f19e67] [cursor=pointer]:
            - /url: https://ask.ifas.ufl.edu/publication/SS478
            - emphasis [ref=f19e68]: Nutrition of Florida Citrus Trees, 3rd Edition
          - text: can be accessed by download the pdf.
          - link "The topic page" [ref=f19e69] [cursor=pointer]:
            - /url: https://ask.ifas.ufl.edu/collections/series_nutrition_of_florida_citrus_trees
          - text: for this book features links to the individual chapters available on Ask IFAS.
        - 'figure "Figure 1. Credit: UF/IFAS" [ref=f19e71]':
          - img "Book cover." [ref=f19e72]
        - heading "Dedication" [level=2] [ref=f19e74]
        - paragraph [ref=f19e75]: "The first edition of this publication was dedicated to emeritus citrus research scientists Drs. Robert C. J. Koo, Ivan Stewart, and Herman Reitz, UF/IFAS Citrus Research and Education Center, Lake Alfred and Paul Smith, USDA-Agricultural Research Service, Orlando. Their research contributions laid the foundation for citrus nutrition programs in Florida. The editors of the second edition dedicate it to an additional group of emeritus citrus research scientists, extension specialists, and educators: Drs. David P. H. Tucker, Larry K. Jackson, and T. Adair Wheaton, CREC-Lake Alfred; Dr. David V. Calvert, Indian River Research and Education Center, Ft. Pierce; and Dr. Heinz Wutscher, USDA-ARS, Orlando. The second edition was edited by Drs. Thomas Obreza (professor, Department of Soil and Water Sciences in Gainesville, then and now Senior Associate Dean of Extension) and Kelly Morgan (assistant professor, UF/IFAS Department of Soil and Water Sciences, Southwest Florida Research and Education Center-Immokalee then, and now center director and professor). Their many years of devoted service furthered our knowledge of nutrient management as the Florida citrus industry entered the era of Best Management Practices and started contending with emerging threats including citrus greening, or huanglongbing."
