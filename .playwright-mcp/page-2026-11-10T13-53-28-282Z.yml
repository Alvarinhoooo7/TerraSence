            - heading "Postharvest Handling and Storage" [level=2] [ref=e210]
            - generic [ref=e211]:
              - generic [ref=e212]:
                - generic [ref=e214]:
                  - generic [ref=e215]: Optimum Temperature
                  - generic [ref=e216]:
                    - paragraph [ref=e217]: Low temperature is extremely important to maintain quality and have an adequate storage life in broccoli. Low temperature reduces respiration rates and undesirable changes in composition (yellowing, browning), reduces water loss, and retards decay. The end of postharvest life is usually indicated by floret yellowing.
                    - paragraph [ref=e218]: The optimal storage temperature for broccoli is 0°C (32°F), which can extend its postharvest life to at least 1 month. As the storage temperature increases, the storage life decreases. At 5°C (41°F), storage life is reduced to about 14 days; at 10°C (50°F), the storage life is about 5 days. These estimates can vary depending on cultivar and production season (see special considerations).
                    - link [ref=e219] [cursor=pointer]:
                      - /url: https://postharvest.ucdavis.edu/sites/g/files/dgvnsk12711/files/media/images/figure_02_2.jpg
                      - 'img "Broccoli Maturity and Quality Photos: Figure 2" [ref=e221]'
                    - paragraph [ref=e222]:
                      - generic [ref=e223]:
                        - strong [ref=e224]: Figure 2.
                        - text: Broccoli stored at different temperatures, showing the effect of storage temperature on yellowing and shelf-life.
                      - emphasis [ref=e225]:
                        - strong [ref=e227]: "Photo Credit: Agricultural Products Preservation Technology and Equipment Innovation Team, JAAS"
                - generic [ref=e229]:
                  - generic [ref=e230]: Optimum Relative Humidity
                  - paragraph [ref=e232]: ">95%"
                - generic [ref=e234]:
                  - generic [ref=e235]: Rates of Respiration
                  - generic [ref=e236]:
                    - paragraph [ref=e237]: Broccoli heads have high respiration rates. The respiration rates of fresh-cut pieces (also called florets) are about twice the rates of the intact heads.
                    - region "Table 2. Average reported respiration rates of broccoli heads stored at different temperatures. Maturity, cultivar and other factors will also affect respiration rates." [ref=e238]:
