          - generic [ref=e137]:
            - heading "Product description" [level=2] [ref=e140]
            - paragraph [ref=e143]:
              - text: Broccoli (
              - emphasis [ref=e144]: Brassica oleracea var. italica
              - text: ) is a nutrient-rich cruciferous vegetable valued for its dense green florets, tender stalks, and mildly earthy, slightly sweet flavor. Typically marketed as whole crowns or pre-cut florets, broccoli is widely recognized for its versatility in culinary applications. It may be consumed raw in salads and vegetable trays, or cooked using methods such as steaming, stir-frying, or roasting, which help enhance flavor and texture. Broccoli is an excellent source of vitamins C and K, dietary fiber, and antioxidant compounds, making it a beneficial component of any diet.
          - generic [ref=e146]:
            - heading "Maturity and Quality" [level=2] [ref=e149]
            - generic [ref=e151]:
              - generic [ref=e152]: Maturity Indices
              - paragraph [ref=e154]: A broccoli head is an immature inflorescence, and all the individual florets (beads) should be closed. Head diameter and compactness are other indicators of maturity.
            - generic [ref=e156]:
              - generic [ref=e157]: Quality Indices
              - generic [ref=e158]:
                - paragraph [ref=e159]: Good quality broccoli should have a dark or bright green color typical of the cultivar. These quality aspects are closely associated with good nutritional value as well as a good appearance. The head or crown should be compact (firm to hand pressure) with a uniform color, and with a cleanly cut stalk of the required length (for head-cut or crown cut). There should be no yellow florets (all florets closed), and there should be no discoloration on the stem bracts.
