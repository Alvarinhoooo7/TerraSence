plugins {
    id 'com.android.application'
    id 'kotlin-parcelize'
    id 'com.android.legacy-kapt' version '9.2.1'
    id 'com.google.devtools.ksp'
    id 'androidx.navigation.safeargs.kotlin'
    id 'com.google.firebase.crashlytics'
    id 'com.google.firebase.firebase-perf'
    id 'dagger.hilt.android.plugin'
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'
    id 'com.google.gms.google-services'
}

repositories {
    mavenCentral()
    google()
    maven { url 'https://jitpack.io' }
}

base {
    archivesName = 'parent'
}

android {
    namespace 'com.sosmartlabs.momo'
    compileSdk = 36

    defaultConfig {
        applicationId "com.sosmartlabs.momo"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 298
        versionName "4.48.0"
        vectorDrawables.useSupportLibrary true
    }

    signingConfigs {
        // Stored locally in gradle.properties
        release {
            storeFile file(soymomoStoreFileLocal)
            storePassword soymomoStorePasswordLocal
            keyAlias soymomoWatchKeyAliasLocal
            keyPassword soymomoWatchKeyPasswordLocal
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
        dataBinding true
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            firebaseCrashlytics {
                mappingFileUploadEnabled true
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "parseApplicationId", "\"$SoyMomoWatchParseApplicationIdProduction\""
            buildConfigField "String", "parseClientKey", "\"$SoyMomoWatchParseClientKeyProduction\""
            buildConfigField "String", "parseRequestUrl", "\"$SoyMomoWatchParseRequestUrlProduction2\""
            buildConfigField "String", "gcmSenderKey", "\"$SoyMomoWatchGCMSenderKeyProduction\""
            buildConfigField "String", "googlePlacesApiKey", "\"$SoyMomoWatchGooglePlacesApiKey\""
            buildConfigField "String", "googleAuthKey", "\"$SoyMomoWatchGoogleAuthKeyProduction\""
            signingConfig signingConfigs.release
        }

        debug {
            debuggable true
            versionNameSuffix "-debug"
            applicationIdSuffix ".debug"
            buildConfigField "String", "parseApplicationId", "\"$SoyMomoWatchParseApplicationIdDevelopment\""
            buildConfigField "String", "parseClientKey", "\"$SoyMomoWatchParseClientKeyDevelopment\""
            buildConfigField "String", "parseRequestUrl", "\"$SoyMomoWatchParseRequestUrlDevelopment\""
            buildConfigField "String", "gcmSenderKey", "\"$SoyMomoWatchGCMSenderKeyDevelopment\""
            buildConfigField "String", "googlePlacesApiKey", "\"$SoyMomoWatchGooglePlacesApiKey\""
            buildConfigField "String", "googleAuthKey", "\"$SoyMomoWatchGoogleAuthKeyDevelopment\""
        }
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

kapt {
    correctErrorTypes true
}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

hilt {
    enableAggregatingTask = true
}

dependencies {

    implementation fileTree(dir: 'libs', include: ['*.jar'])

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'

    // Architecture Components - Navigation
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.8'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.8'

    // Architecture Components - Room
    implementation 'androidx.room:room-runtime:2.8.4'
    implementation 'androidx.room:room-ktx:2.8.4'
    ksp 'androidx.room:room-compiler:2.8.4'

    // Architecture Components - Lifecycle
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.10.0'

    // Architecture Components - WorkManager
    implementation 'androidx.work:work-runtime-ktx:2.11.2'

    // AndroidX: Emoji2
    implementation 'androidx.emoji2:emoji2-emojipicker:1.6.0'
    implementation 'androidx.emoji2:emoji2:1.6.0'

    // Other AndroidX
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.percentlayout:percentlayout:1.0.0'
    implementation 'androidx.transition:transition:1.7.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.vectordrawable:vectordrawable-animated:1.2.0'
    implementation 'androidx.browser:browser:1.10.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.0.0'
    implementation 'androidx.gridlayout:gridlayout:1.1.0'
    implementation 'androidx.annotation:annotation:1.10.0'
    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.9'
    implementation 'androidx.core:core-splashscreen:1.2.0'

    // Hilt
    implementation 'com.google.dagger:hilt-android:2.59.2'
    implementation 'androidx.hilt:hilt-navigation-fragment:1.3.0'
    implementation 'androidx.hilt:hilt-work:1.3.0'
    kapt 'com.google.dagger:hilt-compiler:2.59.2'
    // Kotlin 2.4.0 emits class metadata v2.4.0, but Dagger 2.59.2 bundles a kotlin-metadata-jvm
    // that caps at v2.3.0 (kapt fails: "Provided Metadata instance has version 2.4.0").
    // Since Dagger 2.57 this lib is unshaded, so overriding it on the kapt classpath is the
    // supported fix until a Dagger release ships native Kotlin 2.4.0 support.
    kapt 'org.jetbrains.kotlin:kotlin-metadata-jvm:2.4.0'

    // Material Design
    implementation 'com.google.android.material:material:1.14.0'

    // Parse
    implementation 'com.github.parse-community.Parse-SDK-Android:parse:4.4.0'
    implementation 'com.github.parse-community.Parse-SDK-Android:fcm:4.4.0'
    implementation 'com.github.parse-community.Parse-SDK-Android:ktx:4.4.0'
    implementation 'com.github.parse-community.Parse-SDK-Android:coroutines:4.4.0'
    implementation 'com.github.parse-community:ParseLiveQuery-Android:1.2.2'

    // Google Play Services
    implementation "com.google.android.gms:play-services-base:18.10.0"
    implementation "com.google.android.gms:play-services-auth:21.6.0"
    implementation "com.google.android.gms:play-services-location:21.3.0"
    implementation "com.google.android.gms:play-services-maps:20.0.0"
    implementation 'com.google.android.libraries.places:places:5.2.0'
    implementation 'com.google.android.play:review-ktx:2.0.2'
    implementation 'com.google.maps.android:android-maps-utils:4.4.0'

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:34.14.0')
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-perf'
    implementation 'com.google.firebase:firebase-config'

    // ExoPlayer
    implementation "com.google.android.exoplayer:exoplayer-core:2.19.1"
    implementation "com.google.android.exoplayer:exoplayer-ui:2.19.1"

    // Others from Google
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'com.google.code.gson:gson:2.14.0'

    // Another
    implementation 'com.github.clans:fab:1.6.4'
    implementation 'com.hbb20:ccp:2.7.3'
    implementation 'com.wdullaer:materialdatetimepicker:4.2.3'
    implementation 'com.vanniktech:android-image-cropper:4.7.0'
    implementation 'com.github.stfalcon-studio:StfalconImageViewer:1.0.1'
    implementation 'com.jakewharton.timber:timber:5.0.1'
    implementation 'com.github.bumptech.glide:glide:5.0.7'
    implementation 'jp.wasabeef:glide-transformations:4.3.0'
    implementation 'com.caverock:androidsvg-aar:1.4'
    implementation 'com.airbnb.android:lottie:6.7.1'
    implementation 'io.github.webrtc-sdk:android:144.7559.05'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'com.github.anrwatchdog:anrwatchdog:1.4.0'

    // OkHttp
    implementation platform('com.squareup.okhttp3:okhttp-bom:5.3.2')
    implementation 'com.squareup.okhttp3:okhttp'
    implementation 'com.squareup.okhttp3:logging-interceptor'

    // Session Module
    implementation 'com.sosmartlab:momologin:2.16.0'

    // FlexBox
    implementation 'com.google.android.flexbox:flexbox:3.0.0'

    // Phone Verification
    implementation 'com.googlecode.libphonenumber:libphonenumber:9.0.32'
    
    // ULID - Universally Unique Lexicographically Sortable Identifier
    implementation 'com.aallam.ulid:ulid-kotlin:1.6.0'

    //noinspection NewerVersionAvailable
    implementation 'io.socket:socket.io-client:1.0.2' // We need to upgrade signaling
}
