                    - row [ref=f13e418]:
                      - columnheader "Desired pH change" [ref=f13e419]
                      - columnheader "Soil organic matter content (%)" [ref=f13e420]
                    - row [ref=f13e421]:
                      - columnheader "0.5-2.0" [ref=f13e422]
                      - columnheader "2-4" [ref=f13e423]
                      - columnheader "4-6" [ref=f13e424]
