              - generic [ref=e276]:
                - generic [ref=e278]:
                  - generic [ref=e279]: Rates of Ethylene Production
                  - paragraph [ref=e281]: Ethylene production rates are very low to low (<0.1-1.0 µL/ kg·hr at 20°C (68°F), depending on maturity and cultivar.
                - generic [ref=e283]:
                  - generic [ref=e284]: Responses to Ethylene
                  - paragraph [ref=e286]: Broccoli is extremely sensitive to ethylene exposure. Accelerated floret yellowing is the most common result. Exposure to 2 ppm ethylene at 10°C (50°F) reduces shelf-life by 50%. While low temperature storage is the most effective way to minimize the effects of ethylene, modified atmosphere packaging and 1-MCP (a physiological ethylene blocker) can also contribute to reducing undesirable ethylene effects.
                - generic [ref=e288]:
                  - generic [ref=e289]: Responses to Controlled Atmospheres (CA)
                  - paragraph [ref=e291]:
                    - text: Atmospheres containing 2-3% O
                    - subscript [ref=e293]: "2"
                    - text: and 5-10% CO
                    - subscript [ref=e295]: "2"
                    - text: at a temperature range of 0-5°C (32-41°F) can be beneficial supplements for broccoli. Although low O
                    - subscript [ref=e297]: "2"
                    - text: levels extend shelf-life and quality, temperature fluctuations during commercial handling make this risky, as broccoli can easily produce offensive sulfur-containing volatiles below 2% O
                    - subscript [ref=e299]: "2"
                    - text: . Most modified atmosphere packaging for broccoli is designed to maintain O
                    - subscript [ref=e301]: "2"
                    - text: at 3-10% and CO
                    - subscript [ref=e303]: "2"
                    - text: at about 7-10% to avoid the development of undesirable off-odor volatiles. Microperforated packaging is often used for broccoli products (providing modified atmospheres of about 10% O
                    - subscript [ref=e305]: "2"
                    - text: and 10% CO
                    - subscript [ref=e307]: "2"
                    - text: ).
                - generic [ref=e309]:
                  - generic [ref=e310]: Special Considerations
                  - generic [ref=e311]:
                    - paragraph [ref=e312]:
                      - emphasis [ref=e313]:
                        - strong [ref=e314]: Cooling.
                      - text: Rapid cooling after harvest is very important to maintain quality, minimize water loss and optimize the storage life of broccoli. Broccoli can be cooled by several methods.
                    - paragraph [ref=e315]: For many years, the standard cooling procedure has been a liquid-ice slurry applied to field-packed waxed cartons of broccoli. After draining the cold water, ice remains in the cartons to ensure the broccoli is kept cold during transportation and distribution. However, the weight of the ice increases transportation costs, can be hazardous during distribution when melting, and icing is generally considered unnecessary with current temperature management capabilities. The water remaining on the broccoli after the ice melts may increase decay.
                    - paragraph [ref=e316]: Hydrocooling, hydro-vacuum cooling, and forced-air cooling can also be effective (water sanitation is critical for any method using water). For an iceless broccoli product, temperature management and packaging (often with thin polyethylene liners to minimize water loss) are more critical during distribution than in the case of iced broccoli. The main quality problems experienced to date with iceless broccoli are yellowing and limpness. The former is mostly related to temperature and the latter is mostly related to weight loss (water loss) from the product. Water loss is cumulative during postharvest handling and is affected by conditions at the time of harvest, delays to cool (cut to cool time), the specifics of the cooling method used, packaging, and temperature management throughout distribution. Water loss (weight loss) of 3-4% results in a noticeable and measurable loss of head firmness.
                    - paragraph [ref=e317]
                    - paragraph [ref=e318]:
                      - emphasis [ref=e319]:
                        - strong [ref=e320]: Broccoli cultivars.
                      - text: Storage life varies considerably among broccoli cultivars. At 5°C (41°F) and 95% RH storage life (appearance of any yellow beads = end of shelf-life) may vary from 12 to >25 days depending on the cultivar (18 cultivars evaluated). At a storage temperature of 10°C (50°F), shelf-life varied from 9 to 14 days depending on the cultivar (14 cultivars evaluated). Besides floret yellowing, cut end browning and water loss are other important characteristics that contribute to the end of storage life and these also vary among cultivars. The storage life of fresh-cut florets may be the same or slightly less than that of the intact crowns or heads.
                    - paragraph [ref=e321]
                    - paragraph [ref=e322]:
                      - emphasis [ref=e323]:
                        - strong [ref=e324]: Lighting and shelf-life.
                      - text: Numerous studies have shown the benefit of retail display lighting on broccoli shelf-life, especially if temperature control is deficient (7-15°C; 45-59°F). White LED Light prevents floret yellowing if broccoli is kept on the shelf for several days at higher than recommended temperatures.
                    - link [ref=e325] [cursor=pointer]:
                      - /url: https://postharvest.ucdavis.edu/sites/g/files/dgvnsk12711/files/media/images/figure_09_1.jpg
                      - 'img "Broccoli Temperature, Ethylene & Controlled Atmosphere Photos: Figure 9" [ref=e327]'
                    - paragraph [ref=e328]:
                      - strong [ref=e330]: Figure 3.
                      - text: Effect of white light exposure on broccoli, demonstrating reduced yellowing and maintained floret color compared to the control.
                      - emphasis [ref=e331]:
                        - strong [ref=e333]: "Photo Credit: Agricultural Products Preservation Technology and Equipment Innovation Team, JAAS"
          - generic [ref=e335]:
            - generic [ref=e336]:
              - heading "Physiological and Physical Disorders" [level=2] [ref=e339]
              - generic [ref=e341]:
                - paragraph [ref=e343]:
                  - emphasis [ref=e344]:
                    - strong [ref=e345]: Hollow Stem.
                  - text: An open area in the stem at the cut surface which may become discolored and decay; growing conditions (irrigation, fertilization, temperature) and cultivar selection affect development of this disorder.
                - paragraph [ref=e347]:
                  - emphasis [ref=e348]:
                    - strong [ref=e349]: Floret (bead) Yellowing
                    - text: .
                  - text: The florets are the most perishable part of the broccoli head; yellowing may be due to overmaturity at harvest, high storage temperatures, exposure to ethylene, or storing the product too long. Any development of yellow beads ends commercial marketability. Yellowing due to senescence should not be confused with the light green-yellow color of florets not directly exposed to light during growth (sometimes called ‘marginal yellowing’ in fresh-cut pieces).
                - paragraph [ref=e351]:
                  - emphasis [ref=e352]:
                    - strong [ref=e353]: Brown Floret (bead).
                  - text: Brown bead is a disorder in which areas of florets do not develop correctly, die and lead to brown discolored areas. This is thought to be caused by plant nutritional imbalances.
                - generic [ref=e354]:
                  - paragraph [ref=e355]:
                    - emphasis [ref=e356]:
                      - strong [ref=e357]: Physical damage.
                    - text: Rough handling during harvest and packing can damage the florets and heads and will likely lead to increased decay. If liquid icing is used for cooling, the force used to apply the water-ice slurry can also damage the broccoli heads.
                  - link [ref=e358] [cursor=pointer]:
                    - /url: https://postharvest.ucdavis.edu/sites/g/files/dgvnsk12711/files/media/images/figure_04_1.jpg
                    - 'img "Broccoli Maturity and Quality Photos: Figure 4" [ref=e360]'
                  - paragraph [ref=e361]:
                    - generic [ref=e362]:
                      - strong [ref=e363]: Figure 4
                      - text: . An example of physical damage that may occur during harvesting, packaging, and transportation of broccoli.
                    - emphasis [ref=e364]:
                      - strong [ref=e366]: "Photo Credit: Agricultural Products Preservation Technology and Equipment Innovation Team, JAAS"
                - generic [ref=e367]:
                  - paragraph [ref=e368]:
                    - emphasis [ref=e369]:
                      - strong [ref=e370]: Freezing Injury.
                    - strong [ref=e371]
                    - text: Broccoli will freeze if stored at -0.6°C (30.6°F) to -1.0°C (30°F). This may also occur if salt is used in the liquid-ice slurry for cooling. Frozen and thawed areas appear very dark and translucent, will discolor and lose texture after thawing, and are very susceptible to bacterial decay.
                  - link [ref=e372] [cursor=pointer]:
                    - /url: https://postharvest.ucdavis.edu/sites/g/files/dgvnsk12711/files/media/images/figure_03_2.jpg
                    - 'img "Broccoli Maturity and Quality Photos: Figure 3" [ref=e374]'
                  - paragraph [ref=e375]:
                    - generic [ref=e376]:
                      - strong [ref=e377]: Figure 5.
                      - text: Broccoli showing water-soaked regions and peeling epidermis caused by freezing injury.
                    - emphasis [ref=e378]:
                      - strong [ref=e380]: "Photo Credit: Agricultural Products Preservation Technology and Equipment Innovation Team, JAAS"
            - generic [ref=e381]:
              - heading "Pathological Disorders" [level=2] [ref=e384]
              - generic [ref=e386]:
                - generic [ref=e387]:
                  - paragraph [ref=e388]:
                    - emphasis [ref=e389]:
                      - strong [ref=e390]: Bacterial decay.
                    - text: Various soft-rot causing organisms (
                    - emphasis [ref=e391]: Pseudomonas, Pectobacterium,
                    - text: formerly known as
                    - emphasis [ref=e392]: Erwinia
                    - text: ) may affect broccoli storage life. Rots due to these organisms are usually associated with physical injury. Infected areas become slimy and wet, accompanied by an unpleasant odor. Soft rot caused by
                    - emphasis [ref=e393]: Pseudomonas
                    - text: mainly occurs on the florets, while
                    - emphasis [ref=e394]: Pectobacterium carotovorum
                    - text: infects the stem and florets. These diseases are more likely to occur in humid environments.
                  - link [ref=e395] [cursor=pointer]:
                    - /url: https://postharvest.ucdavis.edu/sites/g/files/dgvnsk12711/files/media/images/figure_06_2.jpg
                    - 'img "Broccoli Maturity and Quality Photos: Figure 6" [ref=e397]'
                  - paragraph [ref=e398]:
                    - strong [ref=e399]: Figure 6.
                    - text: Appearance of broccoli with bacterial soft rots due to Pseudomonas and Pectobacterium.
                    - emphasis [ref=e400]:
                      - strong [ref=e402]: "Photo Credit: Agricultural Products Preservation Technology and Equipment Innovation Team, JAAS"
                - generic [ref=e403]:
                  - paragraph [ref=e404]:
                    - emphasis [ref=e405]:
                      - strong [ref=e406]: Fungal pathogens.
                    - text: Although not as common as bacterial rots, gray mold rot (
                    - emphasis [ref=e407]: Botrytis cinerea
                    - text: ) and black mold (
                    - emphasis [ref=e408]: Alternaria spp.
                    - text: ) can infect broccoli heads; this may occur under rainy, very cool growing conditions.
                  - link [ref=e409] [cursor=pointer]:
