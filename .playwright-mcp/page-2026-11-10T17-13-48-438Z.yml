                      - cell "problem if less than 10, if greater than 500-600 check bog drainage" [ref=f13e536]
                - paragraph [ref=f13e537]:
                  - emphasis [ref=f13e538]:
                    - strong [ref=f13e539]: "Soil samples:"
                  - text: "Samples for analysis of soil nutrients should NOT contain stems, leaves, or the surface duff layer (trash). These are all organic contaminants and will bias the organic matter (OM) determination for the sample. The inclusion of some roots is generally unavoidable. Use a soil probe with a 1-2 inch diameter to collect cores of 4-6 inch depth. Minimum requirements: 4 cores for up to 1 acre; and 1 core for each additional 2 acres up to a total of 10 cores/management unit. After the trash layer on the surface of each is discarded, these cores are combined to make a sample. Collect enough soil to fill a 1 qt plastic bag about ¾ full. At home, open the bags and dry the soil at room temperature for a day or two. Clearly mark each sample bag. Orangic matter determination (usually an additional charge) is often useful."
                - paragraph [ref=f13e540]: Methods of analysis vary by lab - pick a lab and stick with it. The UMass Soils Lab uses the Morgan test. However, the Bray test for soil P is the most commonly used in other labs for samples from the eastern United States. The Bray test, like all common P soil tests, is of limited value in cranberry soils. Standard P ranges for both methods are provided on the next page. The best time to sample cranberry bogs is when the soil is not waterlogged. Wet soils give falsely high P values. Soil samples may be collected with tissue samples in the late summer if no sanding is planned. Otherwise, sample soil in the spring.
                - paragraph [ref=f13e541]:
                  - text: UMass provides soil analysis services at the Amherst lab for a fee. Submission forms for this lab are available at
                  - link "https://ag.umass.edu/services/soil-plant-nutrient-testing-laboratory/or…" [ref=f13e542] [cursor=pointer]:
                    - /url: https://ag.umass.edu/services/soil-plant-nutrient-testing-laboratory/ordering-information-forms
                  - text: .
