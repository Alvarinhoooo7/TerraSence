                  - link "Preventing spring diseases in almond" [ref=f11e96] [cursor=pointer]:
                    - /url: /blog/preventing-spring-diseases-in-almond
                  - paragraph [ref=f11e98]: Petal fall through the first few weeks of nut development is a critical time for disease management. During this period, the almond fruit, newly emerged leaves, and senescing tissues are susceptible to many diseases. These include jacket rot, anthracnose, brown rot, leaf blight, shot-hole, scab, and with Mediterranean varieties, red blotch.
                  - link "Read more →" [ref=f11e99] [cursor=pointer]:
                    - /url: /blog/preventing-spring-diseases-in-almond
              - generic [ref=f11e100]:
                - link "Frost damage to almonds" [ref=f11e102] [cursor=pointer]:
                  - /url: /blog/frost-damage-to-almonds
                  - img "Frost damage to almonds" [ref=f11e104]
                - generic [ref=f11e105]:
                  - link "Frost damage to almonds" [ref=f11e107] [cursor=pointer]:
                    - /url: /blog/frost-damage-to-almonds
                  - paragraph [ref=f11e109]: Almonds are susceptible to frost once they begin to flower. As a flower progresses through bloom (i.e. dormant > pink bud > full bloom > petal fall > small fruit), it becomes more susceptible to cold temperatures. Frost killed flowers/small fruits are easy to identify as the color of the tissue changes.
                  - link "Read more →" [ref=f11e110] [cursor=pointer]:
                    - /url: /blog/frost-damage-to-almonds
