                      - cell "4600" [ref=f13e446]
                      - cell "5500" [ref=f13e447]
                    - row [ref=f13e448]:
                      - rowheader "1 unit" [ref=f13e449]
                      - cell "1000" [ref=f13e450]
                      - cell "3000" [ref=f13e451]
                      - cell "5000" [ref=f13e452]
                      - cell "7000" [ref=f13e453]
                      - cell "9200" [ref=f13e454]
                      - cell "11000" [ref=f13e455]
                - heading "SOIL AND TISSUE TESTS" [level=2] [ref=f13e456]
                - paragraph [ref=f13e457]: Soil and tissue tests are tools that a cranberry grower can use to help diagnose deficiencies of mineral elements, monitoring soil pH, and aiding in the decision making process for choosing fertilizer (tissue tests). These tests are also required for Nutrient Management record keeping.
                - paragraph [ref=f13e458]: However, there are no 'cookbook' type formulas for fertilizing a cranberry bog based on the test results.
                - list [ref=f13e459]:
                  - listitem [ref=f13e460]: standard soil tests poorly predict availability of nutrients and poorly correlate with yield in cranberry;
                  - listitem [ref=f13e461]: as a perennial plant, cranberries store nutrients from the previous season(s) making it impossible to base fertilizer choices only on soil content and yield potential;
                  - listitem [ref=f13e462]: there is virtually no variability in soil test N values from bog to bog;
                  - listitem [ref=f13e463]: tissue test N concentration may vary depending on length of upright (N concentration in the tissue does not always correlate well with added N);
                  - listitem [ref=f13e464]: nutrient availability changes with soil pH and soil pH is not uniform from bog to bog; and
                  - listitem [ref=f13e465]: common soil test methods for P do not give results that correlate well with cranberry yields due to very acid soils in cranberry production – standard P tests are of no predictive value if soil iron is above 200 ppm.
                - paragraph [ref=f13e466]: With these warnings in mind, tissue and soil analyses can be beneficial as a long-term record of changes in your bog. Soil and tissue tests are particularly useful when compared to one another - a soil test alone is virtually useless in determining a fertilizer recommendation for cranberry. Use periodic soil testing to monitor any change in soil pH; we recommend testing soil every 3-5 years for this purpose.
                - paragraph [ref=f13e467]:
                  - text: Tissue tests are more useful for setting target fertilizer ranges. Regular tissue testing meets the mandate for testing in the Massachusetts Nutrient Management Regulations since this is the UMass recommended testing for cranberry. We recommend tissue sampling every 2-4 years (but see also P use and P reduction section above for protocols when adjusting P rates). Keep the results and use them in conjunction with your records of your bog management and performance (growth and cropping) to aid in making fertilizer decisions. For further information regarding tissue testing, refer to “Cranberry tissue testing for producing beds in North America” fact sheet (available at
                  - link "http://scholarworks.umass.edu/cranberry_factsheets/6/)." [ref=f13e468] [cursor=pointer]:
                    - /url: http://scholarworks.umass.edu/cranberry_factsheets/6/).
                - heading [level=3] [ref=f13e469]:
                  - emphasis [ref=f13e470]: When and how to test
                - paragraph [ref=f13e471]: The results you receive from a soil or a tissue test are only as good as the sample you supply to the analytical lab. Follow the instructions for sample collection provided by the lab you are using. Collect one composite sample for each management unit as instructed below. A management unit may vary in size but will generally be a single variety that is treated uniformly, often under one sprinkler system.
                - paragraph [ref=f13e472]:
                  - strong [ref=f13e473]: Tissue samples
                  - text: ": Samples for cranberry tissue analysis should NEVER contain roots, soil, runners, fruit, or trailing woody stems. In general all of these contaminants contain less nutrients than the upright tips. Including them will give a falsely low analysis. Tissue samples are best collected from"
                  - strong [ref=f13e474]: mid-August to mid-September
                  - text: . Samples collected at that time should include
                  - strong [ref=f13e475]: upright tips only
                  - text: (do not strip off the leaves). Collect no more than the
                  - strong [ref=f13e476]: top 2 inches
                  - text: of new growth (mix flowering and vegetative uprights). As you walk a transect across the bog, collect enough material to make about 1 cup (at least 50 upright tips). You may collect directly into marked bags as samples should not be washed. Collect samples when the plants are not wet. Do not mail samples in plastic bags. Moldy samples give poor results.
                  - strong [ref=f13e477]: Always
                  - text: request nitrogen determination. This increases the test cost, but nitrogen levels in the tissue test are an important indicator of plant status and the success of fertilizer programs.
                - paragraph [ref=f13e478]:
                  - strong [ref=f13e479]: Sampling other than in August-September
                  - text: ": Tissue samples may be collected at other times of the year if absolutely necessary. However, nutrient levels change more rapidly outside of the recommended time and make interpretation of the results more difficult. If sampling in the spring, samples should be collected in June and consist of"
                  - strong [ref=f13e480]: new upright tissue
                  - text: only. Do not include last season's leaves - they will lead to a falsely low result.
                  - emphasis [ref=f13e481]: In June samples, nitrogen should be 1.2-1.5%, phosphorus 0.15-0.19%, and potassium 0.7-0.9%.
                  - text: Interpretations for other elements are challenging in June samples.
                - paragraph [ref=f13e482]: Tissue samples should also be collected when deficiency is suspected or diagnosis of a specific problem is needed. For problem diagnosis, collect 2 separate samples - one from the problem area, and one from nearby 'normal' vines.
                - paragraph [ref=f13e483]: Samples collected after mid-September give lower analysis values than those collected earlier. This is especially true for nitrogen (it is transported out of upright tips and stored in older tissue as dormancy approaches). Also, late in the season the uprights become more woody so that more of a tip sample is stem tissue. Stems have less nutrient content than do leaves so the overall result is a lower analytical value.
                - heading "TISSUE STANDARDS (August 10 to September 15 collection)" [level=3] [ref=f13e484]
                - paragraph [ref=f13e485]: Standards developed in conjunction with researchers throughout the cranberry growing areas of the USA
                - table "Major Element Concentration in Dried Tissue (Percent)" [ref=f13e487]:
