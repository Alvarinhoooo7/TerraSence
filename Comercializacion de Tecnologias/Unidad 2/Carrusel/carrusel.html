<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Carrusel TerraSense</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --noche: #12281F;
    --bosque: #1F5B3F;
    --vivo: #2E8B5A;
    --brote: #6FD3A0;
    --fondo: #F2F5F1;
    --tarjeta: #FFFFFF;
    --tierra: #8A6A3B;
    --ocre: #C9762B;
    --rojo: #A33528;
    --ambar: #9E6612;
    --texto: #14201B;
    --texto2: #48584F;
    --borde: #DCE4DD;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Roboto', 'Segoe UI', Arial, sans-serif; background: #E9EEEA; color: var(--texto); }

  /* ---------- Diapositiva base: 1080 x 1350 (formato 4:5 de redes sociales) ---------- */
  .slide { width: 1080px; height: 1350px; position: relative; overflow: hidden; padding: 96px 90px; display: flex; flex-direction: column; }
  .dark { background: var(--noche); color: #fff; }
  .green { background: var(--bosque); color: #fff; }
  .light { background: var(--fondo); }
  .counter { position: absolute; top: 48px; right: 54px; font-size: 30px; font-weight: 500; padding: 10px 22px; border-radius: 40px; background: rgba(0,0,0,.35); color: #fff; }
  .light .counter { background: rgba(20,32,27,.55); }
  .kicker { font-size: 34px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; color: var(--ocre); margin-bottom: 28px; }
  .dark .kicker, .green .kicker { color: var(--brote); }
  h1 { font-size: 118px; line-height: 1.02; font-weight: 900; letter-spacing: -2px; }
  h2 { font-size: 84px; line-height: 1.06; font-weight: 900; letter-spacing: -1.5px; }
  .sub { font-size: 44px; line-height: 1.3; margin-top: 34px; color: var(--texto2); }
  .dark .sub, .green .sub { color: #CFE3D8; }
  .hl { color: var(--brote); }
  .hl-ocre { color: var(--ocre); }
  .brand { display: flex; align-items: center; gap: 18px; font-size: 40px; font-weight: 700; letter-spacing: -.5px; }
  .brand img { width: 76px; height: 76px; border-radius: 18px; }
  .brand .t { color: #fff; } .brand .s { color: var(--brote); }
  .light .brand .t { color: var(--noche); } .light .brand .s { color: var(--vivo); }
  .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; }

  /* Diapositiva 1 */
  .s1 .art { position: absolute; left: 0; right: 0; bottom: 0; height: 640px; }
  .s1 .swipe { position: absolute; right: 90px; bottom: 80px; font-size: 36px; font-weight: 700; background: var(--ocre); color: #fff; padding: 22px 38px; border-radius: 60px; display: flex; align-items: center; gap: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.3); }

  /* Diapositiva 2: medidor genérico */
  .meter { margin: 40px auto 0; width: 640px; background: #3A3F3D; border-radius: 48px; padding: 46px 46px 60px; box-shadow: 0 30px 60px rgba(0,0,0,.25); }
  .lcd { background: #B9C7A8; border-radius: 20px; padding: 34px 40px; font-family: 'Roboto Mono', monospace; color: #26301F; box-shadow: inset 0 4px 12px rgba(0,0,0,.25); }
  .lcd .row { display: flex; justify-content: space-between; align-items: baseline; }
  .lcd .row + .row { margin-top: 14px; border-top: 3px dashed rgba(38,48,31,.25); padding-top: 14px; }
  .lcd .lab { font-size: 34px; font-weight: 700; }
  .lcd .val { font-size: 92px; font-weight: 700; letter-spacing: -2px; }
  .meter .btns { display: flex; justify-content: center; gap: 40px; margin-top: 40px; }
  .meter .btns span { width: 90px; height: 90px; border-radius: 50%; background: #555B58; box-shadow: inset 0 -6px 0 rgba(0,0,0,.3); }
  .s2 h2 { margin-top: 70px; text-align: center; font-size: 120px; }
  .s2 .sub { text-align: center; }

  /* Diapositiva 3: tarjeta de la app */
  .app { margin-top: 10px; background: var(--tarjeta); border-radius: 44px; padding: 44px; box-shadow: 0 24px 60px rgba(18,40,31,.16); border: 2px solid var(--borde); }
  .app .head { display: flex; justify-content: space-between; align-items: center; font-size: 34px; color: var(--texto2); font-weight: 500; }
  .app .crop { font-size: 52px; font-weight: 900; color: var(--texto); margin-top: 8px; }
  .verdict { margin-top: 26px; display: flex; align-items: center; gap: 18px; background: #F8E6E3; color: var(--rojo); border: 3px solid var(--rojo); border-radius: 26px; padding: 22px 28px; font-size: 44px; font-weight: 900; }
  .verdict svg { flex: none; }
  .chips { display: flex; gap: 20px; margin-top: 24px; }
  .chip { flex: 1; border-radius: 24px; padding: 20px 24px; background: #FBF1E3; border: 2px solid #E9C99B; }
  .chip .k { font-size: 28px; color: var(--texto2); }
  .chip .v { font-size: 60px; font-weight: 900; color: var(--texto); }
  .chip .st { font-size: 28px; font-weight: 700; color: var(--ambar); }
  .tip { display: flex; gap: 24px; margin-top: 36px; align-items: flex-start; }
  .tip .ic { flex: none; width: 76px; height: 76px; border-radius: 22px; display: grid; place-items: center; }
  .tip p { font-size: 40px; line-height: 1.32; color: var(--texto); }
  .tip b { font-weight: 900; }
  .s3 .tagline { margin-top: auto; font-size: 64px; font-weight: 900; color: var(--bosque); text-align: center; letter-spacing: -1px; }

  /* Diapositiva 4: beneficios */
  .grid4 { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; margin-top: 56px; }
  .ben { background: rgba(255,255,255,.08); border: 2px solid rgba(111,211,160,.35); border-radius: 36px; padding: 34px 34px; }
  .ben .ic { width: 96px; height: 96px; border-radius: 28px; background: var(--brote); display: grid; place-items: center; }
  .ben h3 { font-size: 42px; font-weight: 900; margin-top: 22px; line-height: 1.08; }
  .ben p { font-size: 30px; margin-top: 12px; color: #CFE3D8; line-height: 1.3; }

  /* Diapositiva 5: prueba */
  .bars { margin-top: 70px; }
  .bar { margin-bottom: 46px; }
  .bar .lab { display: flex; justify-content: space-between; font-size: 36px; font-weight: 700; margin-bottom: 16px; }
  .bar .lab small { font-weight: 400; color: var(--texto2); font-size: 30px; display: block; margin-top: 4px; }
  .bar .track { height: 110px; background: #E1E8E2; border-radius: 26px; overflow: hidden; }
  .bar .fill { height: 100%; border-radius: 26px; display: flex; align-items: center; justify-content: flex-end; padding-right: 30px; font-size: 48px; font-weight: 900; color: #fff; }
  .note { font-size: 28px; color: var(--texto2); line-height: 1.35; }
  .badges { display: flex; gap: 22px; margin-top: auto; }
  .badge { flex: 1; text-align: center; background: var(--tarjeta); border: 2px solid var(--borde); border-radius: 30px; padding: 30px 14px; }
  .badge b { display: block; font-size: 50px; font-weight: 900; color: var(--bosque); }
  .badge span { font-size: 28px; color: var(--texto2); }

  /* Diapositiva 6: acción */
  .s6 { align-items: center; text-align: center; justify-content: center; }
  .s6 .logo { width: 720px; margin-bottom: 70px; }
  .s6 h2 { font-size: 112px; }
  .cta { margin-top: 70px; display: inline-flex; align-items: center; gap: 24px; background: #25D366; color: #0B2A17; font-size: 50px; font-weight: 900; padding: 38px 64px; border-radius: 80px; box-shadow: 0 16px 40px rgba(0,0,0,.35); }
  .web { margin-top: 40px; font-size: 42px; color: #CFE3D8; }
  .web b { color: #fff; }
  .price { margin-top: 80px; font-size: 34px; color: var(--brote); font-weight: 700; letter-spacing: 1px; }

  /* ---------- Teléfono con la publicación ---------- */
  .phone { width: 440px; height: 900px; background: #0E1411; border-radius: 64px; padding: 16px; box-shadow: 0 40px 80px rgba(18,40,31,.35), inset 0 0 0 3px #2A332F; position: relative; }
  .screen { width: 100%; height: 100%; background: #fff; border-radius: 50px; overflow: hidden; position: relative; display: flex; flex-direction: column; }
  .notch { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 120px; height: 34px; background: #0E1411; border-radius: 20px; z-index: 3; }
  .status { height: 52px; display: flex; justify-content: space-between; align-items: center; padding: 8px 32px 0; font-size: 15px; font-weight: 700; }
  .post-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; }
  .post-head .av { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--vivo); padding: 3px; background: #fff; }
  .post-head .av img { width: 100%; height: 100%; }
  .post-head .nm { font-size: 15px; font-weight: 700; line-height: 1.15; }
  .post-head .nm small { display: block; font-weight: 400; font-size: 12px; color: #6B7570; }
  .post-head .dots3 { margin-left: auto; font-size: 22px; color: #333; letter-spacing: 1px; }
  .media { width: 408px; height: 510px; position: relative; overflow: hidden; background: #ddd; }
  .media .slide { transform: scale(0.37778); transform-origin: top left; position: absolute; top: 0; left: 0; }
  .ctabar { display: flex; justify-content: space-between; align-items: center; padding: 11px 14px; background: #F2F5F1; border-bottom: 1px solid #E3E8E4; font-size: 14px; font-weight: 700; color: var(--bosque); }
  .actions { display: flex; align-items: center; gap: 16px; padding: 10px 14px 4px; }
  .actions .pg { display: flex; gap: 5px; margin: 0 auto; transform: translateX(-30px); }
  .actions .pg i { width: 6px; height: 6px; border-radius: 50%; background: #C5CCC8; }
  .actions .pg i.on { background: #2B7FE0; }
  .cap { padding: 4px 14px; font-size: 13.5px; line-height: 1.4; color: #222; }
  .cap b { font-weight: 700; }
  .cap .tag { color: #1F5B9A; }
  .navbar { margin-top: auto; height: 58px; border-top: 1px solid #E8ECEA; display: flex; justify-content: space-around; align-items: center; }
  .navbar span { width: 24px; height: 24px; border-radius: 7px; border: 2.5px solid #222; }
  .navbar span:nth-child(3) { border-radius: 8px; }

  /* ---------- Vistas de exportación ---------- */
  .view { display: none; }
  body.v-slide .view-slide, body.v-phone .view-phone, body.v-grid .view-grid, body.v-all .view-all { display: block; }
  .view-phone { padding: 40px; }
  .view-grid { width: 1920px; height: 1080px; background: var(--fondo); padding: 60px 70px; }
  .view-grid .g-title { font-size: 54px; font-weight: 900; color: var(--noche); letter-spacing: -1px; }
  .view-grid .lead { font-size: 24px; color: var(--texto2); margin-top: 8px; }
  .view-grid .g-row { display: flex; justify-content: space-between; margin-top: 46px; }
  .view-grid .cell { width: 286px; }
  .view-grid .step, .view-grid .lvl { display: flex; justify-content: center; }
  .view-grid .lvl { margin-top: 18px; font-size: 20px; font-weight: 700; color: var(--texto2); text-transform: uppercase; letter-spacing: 2px; }
  .view-grid .step { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 900; color: var(--bosque); margin-bottom: 18px; }
  .view-grid .step i { font-style: normal; width: 38px; height: 38px; border-radius: 50%; background: var(--bosque); color: #fff; display: grid; place-items: center; font-size: 20px; }
  .view-grid .phone-wrap { width: 286px; height: 585px; }
  .view-grid .phone-wrap .phone { transform: scale(0.65); transform-origin: top left; }
  .view-grid .funnel { margin-top: 8px; height: 14px; border-radius: 7px; background: linear-gradient(90deg, var(--ocre), var(--vivo)); }
  .view-all { padding: 40px; }
  .view-all .phones { display: flex; flex-wrap: wrap; gap: 40px; }
</style>
</head>
<body>

<!-- Las 6 diapositivas se definen una vez en <template> y se clonan en cada vista. -->
<template id="slides">

  <!-- 1. Impacto -->
  <section class="slide dark s1">
    <div class="counter">1/6</div>
    <div class="brand"><img src="../Figuras/logo_icono.png" alt=""><span><span class="t">Terra</span><span class="s">Sense</span></span></div>
    <h1 style="margin-top:90px">¿Riego hoy<br>o <span class="hl">mañana?</span></h1>
    <p class="sub">Vas a sembrar tomate y el suelo se ve seco.<br>Equivocarte cuesta agua… y la temporada.</p>
    <svg class="art" viewBox="0 0 1080 640" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <!-- nube con lluvia -->
      <g opacity=".9">
        <ellipse cx="820" cy="120" rx="120" ry="62" fill="#2F4A3E"/>
        <ellipse cx="740" cy="140" rx="80" ry="48" fill="#2F4A3E"/>
        <ellipse cx="900" cy="145" rx="78" ry="44" fill="#2F4A3E"/>
        <g stroke="#6FD3A0" stroke-width="8" stroke-linecap="round" opacity=".8">
          <line x1="760" y1="210" x2="745" y2="250"/><line x1="820" y1="215" x2="805" y2="255"/><line x1="880" y1="210" x2="865" y2="250"/>
        </g>
      </g>
      <!-- sol -->
      <circle cx="210" cy="150" r="70" fill="#C9762B"/>
      <g stroke="#C9762B" stroke-width="10" stroke-linecap="round">
        <line x1="210" y1="40" x2="210" y2="60"/><line x1="210" y1="240" x2="210" y2="260"/><line x1="100" y1="150" x2="120" y2="150"/><line x1="300" y1="150" x2="320" y2="150"/>
        <line x1="132" y1="72" x2="146" y2="86"/><line x1="274" y1="214" x2="288" y2="228"/><line x1="288" y1="72" x2="274" y2="86"/><line x1="146" y1="214" x2="132" y2="228"/>
      </g>
      <!-- estratos del suelo -->
      <path d="M0 360 Q270 330 540 352 T1080 345 V640 H0Z" fill="#8A6A3B"/>
      <path d="M0 450 Q300 430 560 448 T1080 440 V640 H0Z" fill="#6E5430"/>
      <path d="M0 540 Q320 525 580 540 T1080 532 V640 H0Z" fill="#523F24"/>
      <!-- grietas de suelo seco -->
      <g stroke="#5A4426" stroke-width="5" fill="none" stroke-linecap="round">
        <path d="M120 375 l40 22 l-12 28 l34 18"/><path d="M880 372 l-30 25 l18 26 l-26 24"/><path d="M640 380 l26 20 l-8 30"/>
      </g>
      <!-- brote de tomate -->
      <path d="M520 352 C520 300 522 270 526 230" stroke="#2E8B5A" stroke-width="12" fill="none" stroke-linecap="round"/>
      <path d="M526 250 C480 240 452 205 456 168 C500 170 524 205 526 250Z" fill="#2E8B5A"/>
      <path d="M526 236 C566 222 594 186 588 150 C546 156 524 192 526 236Z" fill="#4FB783"/>
      <!-- sonda -->
      <rect x="616" y="250" width="44" height="72" rx="12" fill="#E4EAE6"/>
      <line x1="638" y1="320" x2="638" y2="470" stroke="#E4EAE6" stroke-width="12" stroke-linecap="round"/>
      <circle cx="638" cy="286" r="9" fill="#2E8B5A"/>
    </svg>
    <div class="swipe">Desliza <svg width="34" height="34" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  </section>

  <!-- 2. Problema -->
  <section class="slide light s2">
    <div class="counter">2/6</div>
    <div class="kicker">Lo que ves hoy</div>
    <div class="meter">
      <div class="lcd">
        <div class="row"><span class="lab">HUMEDAD</span><span class="val">14%</span></div>
        <div class="row"><span class="lab">T° SUELO</span><span class="val">11°C</span></div>
      </div>
      <div class="btns"><span></span><span></span></div>
    </div>
    <h2>¿Y ahora <span class="hl-ocre">qué?</span></h2>
    <p class="sub">Un medidor común te da números.<br>La decisión, y el riesgo, siguen siendo tuyos.</p>
    <div class="foot" style="justify-content:center"><span style="font-size:34px;font-weight:700;color:var(--bosque)">Desliza y mira la diferencia →</span></div>
  </section>

  <!-- 3. Giro -->
  <section class="slide light s3">
    <div class="counter">3/6</div>
    <div class="kicker">Lo mismo, con TerraSense</div>
    <div class="app">
      <div class="head"><span>Medición de hoy · 08:42</span><span>Pronóstico actualizado ✓</span></div>
      <div class="crop">Tomate · Pre-siembra</div>
      <div class="verdict">
        <svg width="50" height="50" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#A33528"/><path d="M8 8l8 8M16 8l-8 8" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>
        No sembrar todavía
      </div>
      <div class="chips">
        <div class="chip"><div class="k">Humedad</div><div class="v">14 %</div><div class="st">▼ Baja</div></div>
        <div class="chip"><div class="k">Temperatura del suelo</div><div class="v">11 °C</div><div class="st">▼ Fría para el tomate</div></div>
      </div>
      <div class="tip">
        <div class="ic" style="background:#E3EEF8"><svg width="46" height="46" viewBox="0 0 24 24"><path d="M7 15a4 4 0 0 1 .5-8A5.5 5.5 0 0 1 18 8.5 3.5 3.5 0 0 1 17.5 15Z" fill="#3F6E9A"/><path d="M9 18l-1 3M13 18l-1 3M17 18l-1 3" stroke="#3F6E9A" stroke-width="2" stroke-linecap="round"/></svg></div>
        <p><b>No riegues hoy.</b> El pronóstico indica una semana lluviosa: 12 mm para el jueves. Espera la lluvia y vuelve a medir.</p>
      </div>
      <div class="tip">
        <div class="ic" style="background:#FBF1E3"><svg width="46" height="46" viewBox="0 0 24 24"><path d="M10 4a2 2 0 1 1 4 0v9.3a4 4 0 1 1-4 0Z" fill="none" stroke="#9E6612" stroke-width="2"/><circle cx="12" cy="17" r="2" fill="#9E6612"/><path d="M12 15V9" stroke="#9E6612" stroke-width="2" stroke-linecap="round"/></svg></div>
        <p><b>Espera para sembrar.</b> El tomate necesita el suelo sobre 15 °C; hoy está a 11 °C.</p>
      </div>
    </div>
    <div class="tagline">Del número a la decisión.</div>
  </section>

  <!-- 4. Beneficios -->
  <section class="slide green s4">
    <div class="counter">4/6</div>
    <div class="kicker">Por qué TerraSense</div>
    <h2 style="font-size:78px">Todo para decidir,<br>en el mismo campo</h2>
    <div class="grid4">
      <div class="ben">
        <div class="ic"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#12281F" stroke-width="2.2" stroke-linecap="round"><path d="M2 8.5a15 15 0 0 1 20 0M5.5 12a10 10 0 0 1 13 0M9 15.5a5 5 0 0 1 6 0"/><circle cx="12" cy="19" r="1.3" fill="#12281F"/><path d="M3 3l18 18"/></svg></div>
        <h3>Funciona sin señal</h3><p>Mide, interpreta y guarda aunque no haya cobertura.</p>
      </div>
      <div class="ben">
        <div class="ic"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#12281F" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v18M7 8v8M17 6v12M2 11v2M22 10v4"/></svg></div>
        <h3>10 variables</h3><p>7 del suelo y 3 del ambiente, en un solo equipo.</p>
      </div>
      <div class="ben">
        <div class="ic"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#12281F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V11"/><path d="M12 13c-4 0-6-3-6-7 4 0 6 3 6 7Z"/><path d="M12 11c0-4 2-7 6-7 0 4-2 7-6 7Z"/></svg></div>
        <h3>Según tu cultivo y su etapa</h3><p>8 cultivos, de la pre-siembra a la cosecha.</p>
      </div>
      <div class="ben">
        <div class="ic"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#12281F" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18M7 15h4"/></svg></div>
        <h3>Pago único</h3><p>Sin mensualidades. Mediciones ilimitadas.</p>
      </div>
    </div>
    <p class="sub" style="margin-top:44px;font-size:36px">Con señal, suma el pronóstico del tiempo a cada recomendación.</p>
  </section>

  <!-- 5. Prueba -->
  <section class="slide light s5">
    <div class="counter">5/6</div>
    <div class="kicker">Haz la cuenta</div>
    <h2>En 3 años, te sale más barato que el laboratorio</h2>
    <div class="bars">
      <div class="bar">
        <div class="lab"><span>Análisis de laboratorio<small>4 muestras al año</small></span></div>
        <div class="track"><div class="fill" style="width:100%;background:var(--ocre)">$600.000</div></div>
      </div>
      <div class="bar">
        <div class="lab"><span>TerraSense<small>Mediciones ilimitadas</small></span></div>
        <div class="track"><div class="fill" style="width:82%;background:var(--bosque)">$492.453</div></div>
      </div>
      <p class="note">Costo acumulado a 3 años, en pesos de 2027. El laboratorio sigue siendo clave para un análisis químico completo; TerraSense te acompaña en cada decisión entre un análisis y otro.</p>
    </div>
    <div class="badges">
      <div class="badge"><b>6 meses</b><span>de garantía</span></div>
      <div class="badge"><b>10 días</b><span>para arrepentirte</span></div>
      <div class="badge"><b>Gratis</b><span>despacho a todo Chile</span></div>
    </div>
  </section>

  <!-- 6. Acción -->
  <section class="slide dark s6">
    <div class="counter">6/6</div>
    <img class="logo" src="../../../Logo/Logo/terrasense-dark.svg" alt="TerraSense">

<script>
  const slides = [...document.getElementById('slides').content.querySelectorAll('.slide')];
  const steps = ['Impacto', 'Problema', 'Giro', 'Beneficios', 'Prueba', 'Acción'];
  // Nivel del embudo digital del informe (sección 8) al que apunta cada imagen.
  const levels = ['Atracción', 'Atracción', 'Consideración', 'Consideración', 'Consideración', 'Conversión'];

  function phone(i) {
    const p = document.getElementById('phone-tpl').content.firstElementChild.cloneNode(true);
    p.querySelector('.media').appendChild(slides[i].cloneNode(true));
    p.querySelector('.pg').innerHTML = slides.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('');
    return p;
  }

  // #slide-3 → diapositiva 3 sola (1080 x 1350); #phone-3 → dentro del teléfono;
  // #grid → resumen de las seis para una diapositiva 16:9; sin hash → todas.
  const [mode, n] = (location.hash.slice(1) || 'all').split('-');
  const i = Math.max(0, Math.min(5, (parseInt(n, 10) || 1) - 1));
  document.body.className = 'v-' + mode;
  if (mode === 'slide') document.getElementById('view-slide').appendChild(slides[i].cloneNode(true));
  if (mode === 'phone') document.getElementById('view-phone').appendChild(phone(i));
  if (mode === 'grid') {
    const row = document.getElementById('grid-row');
    slides.forEach((_, k) => {
      const c = document.createElement('div');
      c.className = 'cell';
      c.innerHTML = `<div class="step"><i>${k + 1}</i>${steps[k]}</div><div class="phone-wrap"></div><div class="lvl">${levels[k]}</div>`;
      c.querySelector('.phone-wrap').appendChild(phone(k));
      row.appendChild(c);
    });
  }
  if (mode === 'all') slides.forEach((_, k) => document.getElementById('all').appendChild(phone(k)));
</script>
