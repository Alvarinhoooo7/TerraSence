<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Agronomic Forest Green -->
    <linearGradient id="forestEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052e16" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- Subtle inner bevel highlight -->
    <linearGradient id="innerBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.1" />
    </linearGradient>

    <!-- App icon shadow for PNG asset export -->
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#022c22" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- FONDO TRANSPARENTE: Sin lienzo gris ni rectángulo base -->

  <!-- App Icon Squircle: Dark Premium Forest Green Hardware Finish -->
  <rect x="56" y="56" width="400" height="400" rx="92" fill="url(#forestEmeraldGrad)" stroke="url(#innerBorder)" stroke-width="2.5" filter="url(#softGlow)"/>

  <!-- Subtle Soil horizon glow lines in dark mode -->
  <g transform="translate(46, 18) scale(1.9)">
    <!-- Soil Stratum Horizon lines -->
    <line x1="40" y1="120" x2="180" y2="120" stroke="#10b981" stroke-opacity="0.4" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="58" y1="145" x2="162" y2="145" stroke="#34d399" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="5 5" stroke-linecap="round"/>
    <line x1="75" y1="170" x2="145" y2="170" stroke="#34d399" stroke-opacity="0.15" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Sensor Probe Tip / Hardware Pin entering soil -->
    <path d="M 110 90 L 110 185 L 110 195" stroke="#34D399" stroke-width="5" stroke-linecap="round"/>
    <polygon points="106,192 114,192 110,202" fill="#34D399"/>

    <!-- Sensor Calibration Ring / Depth bands on probe -->
    <rect x="107" y="128" width="6" height="3.5" rx="1.5" fill="#6EE7B7"/>
    <rect x="107" y="153" width="6" height="3.5" rx="1.5" fill="#6EE7B7"/>

    <!-- Plant / Foliage geometry rising upwards from probe collar -->
    <!-- Left Leaf (Emerald Green contrast) -->
    <path d="M 110 95 C 75 90 55 55 65 15 C 95 15 110 55 110 95 Z" fill="#10B981"/>

    <!-- Right Leaf (Vibrant Bright Mint Green for screen visibility) -->
    <path d="M 110 75 C 135 70 160 40 150 5 C 125 5 110 40 110 75 Z" fill="#4ADE80"/>

    <!-- Pure central stem signal node -->
    <circle cx="110" cy="95" r="4" fill="#ECFDF5"/>
    <circle cx="110" cy="95" r="2" fill="#064E3B"/>
  </g>

  <!-- Micro Brand Tag -->
  <text x="256" y="428" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-weight="700" 
        font-size="12" 
        fill="#A7F3D0" 
        letter-spacing="5">TERRASENSE</text>
</svg>
