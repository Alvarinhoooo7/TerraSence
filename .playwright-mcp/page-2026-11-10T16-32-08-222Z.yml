            - article [ref=f12e106]:
              - generic [ref=f12e108]:
                - paragraph [ref=f12e109]: ANR Publications serves the community through a variety of publications; from short Open Access extension papers through to complex single crop production manuals. Extension papers are freely available and print books may be purchased.
                - paragraph [ref=f12e110]: "Visit the following sites to find out more:"
                - paragraph [ref=f12e111]:
                  - link [ref=f12e112] [cursor=pointer]:
                    - /url: https://anrpublications.org
                    - strong [ref=f12e113]: ANRPublications.org
                - paragraph [ref=f12e114]: From the Master Gardener Manual to bee identification flip books, ANRpublications.org has a wide range of books available.
                - paragraph [ref=f12e115]: Questions about your order? Email StylusMail@PressWarehouse.com or (800) 232-0223.
                - paragraph [ref=f12e116]:
                  - strong [ref=f12e117]: Open Access Publishing
                - paragraph [ref=f12e118]: ANR provides an extensive number of freely available papers on extension-related subjects.
                - paragraph [ref=f12e119]:
                  - link "ANR Library" [ref=f12e120] [cursor=pointer]:
                    - /url: https://anrlibrary.org
                  - text: is the replacement for the old 'catalog' site. It hosts Open Access extension papers that are ADA compliant. New content, and older publications that are accessible may be found on this site.
                - paragraph [ref=f12e121]:
                  - link "eScholarship" [ref=f12e122] [cursor=pointer]:
                    - /url: https://escholarship.org/uc/anrcs
                  - text: is the archival repository for historic publications that are not ADA compliant.
                - paragraph [ref=f12e123]:
                  - link [ref=f12e124] [cursor=pointer]:
                    - /url: http://californiaagriculture.org/
                    - emphasis [ref=f12e125]: California Agriculture
                  - text: is a peer-reviewed journal reporting research, reviews and news from the University of California and its Agriculture and Natural Resources division.
                - paragraph [ref=f12e126]:
                  - text: Can't find what you're looking for? Email us at
                  - link "anrcatalog@ucanr.edu" [ref=f12e127] [cursor=pointer]:
                    - /url: mailto:anrcatalog@ucanr.edu
                  - text: and we'll be happy to help.
