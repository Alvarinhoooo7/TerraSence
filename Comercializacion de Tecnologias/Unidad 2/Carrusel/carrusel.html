<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Carrusel TerraSense</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto:wght@400;500;700;900&family=Roboto+Mono:wght@700&display=swap" rel="stylesheet">
<!--
  Carrusel publicitario «Del número a la decisión» — Sonda portátil multivariable para el sensado agronómico.
  Las pantallas de la app reproducen el paso «¿Qué tienes plantado?» de MeasureScreen
  (SpeciesPicker con sus 111 especies en siete grupos) y el plan de recomendaciones de
  MeasurementResultFlow, con los textos que entrega el motor agronómico real para esta
  lectura: tomate en etapa vegetativa, humedad 5 %, suelo a 17 °C, pH 6,4, CE 650 µS/cm,
  12 mm de lluvia pronosticados para el día siguiente (mié 14 oct) y 3 mm el jueves.

  Vistas (hash de la URL): sin hash o #carrusel-N, carrusel navegable para presentar
  (flechas, clic, arrastre o control remoto; V cambia entre celular y diapositiva completa,
  F pone pantalla completa); #slide-N (1080 x 1350), #phone-N (publicación en un iPhone),
  #grid (resumen 16:9 de las siete) y #all, todas.
-->
<style>
  :root {
    --noche: #12281F; --bosque: #1F5B3F; --vivo: #2E8B5A; --brote: #6FD3A0;
    --fondo: #F2F5F1; --tarjeta: #FFFFFF; --ocre: #C9762B;
    --texto: #14201B; --texto2: #48584F; --borde: #DCE4DD;
    --ok: #2C7A4E; --warn: #9E6612; --bad: #A33528;
    --ios: 'Inter', -apple-system, 'SF Pro Text', 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Roboto', 'Segoe UI', Arial, sans-serif; background: #E9EEEA; color: var(--texto); }

  /* ================= Diapositivas 1080 x 1350 ================= */
  .slide { width: 1080px; height: 1350px; position: relative; overflow: hidden; padding: 96px 90px; display: flex; flex-direction: column; }
  .dark { background: var(--noche); color: #fff; }
  .green { background: var(--bosque); color: #fff; }
  .light { background: var(--fondo); }
  .counter { position: absolute; top: 48px; right: 54px; font-size: 30px; font-weight: 500; padding: 10px 22px; border-radius: 40px; background: rgba(0,0,0,.35); color: #fff; z-index: 5; }
  .light .counter { background: rgba(20,32,27,.55); }
  .kicker { font-size: 34px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; color: var(--ocre); margin-bottom: 26px; }
  .dark .kicker, .green .kicker { color: var(--brote); }
  .h1 { font-size: 118px; line-height: 1.02; font-weight: 900; letter-spacing: -2px; }
  .h2 { font-size: 84px; line-height: 1.06; font-weight: 900; letter-spacing: -1.5px; }
  .sub { font-size: 44px; line-height: 1.3; margin-top: 30px; color: var(--texto2); }
  .dark .sub, .green .sub { color: #CFE3D8; }
  .hl { color: var(--brote); } .hl-ocre { color: var(--ocre); } .hl-bosque { color: var(--bosque); }
  .brand { display: flex; align-items: center; gap: 18px; font-size: 40px; font-weight: 700; letter-spacing: -.5px; }
  .brand img.ic-ts { width: 78px; height: 78px; border-radius: 18px; } .brand img.wm-ts { height: 48px; width: auto; }
  .brand .t { color: #fff; } .brand .s { color: var(--brote); }

  /* 1. Impacto */
  .s1 .art { position: absolute; left: 0; right: 0; bottom: 0; height: 600px; }
  .prod-pill { display: inline-block; margin-top: 28px; padding: 14px 26px; border-radius: 40px; background: rgba(111,211,160,.14); border: 2px solid rgba(111,211,160,.45); color: var(--brote); font-size: 25px; font-weight: 800; letter-spacing: 1.3px; text-transform: uppercase; align-self: flex-start; }
  .swipe { position: absolute; right: 90px; bottom: 80px; font-size: 36px; font-weight: 700; background: var(--ocre); color: #fff; padding: 22px 38px; border-radius: 60px; display: flex; align-items: center; gap: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.3); }

  /* 2. Problema: medidor genérico vs nodo fijo */
  .meter { margin: 18px auto 0; width: 610px; background: #3A3F3D; border-radius: 44px; padding: 34px 40px 42px; box-shadow: 0 26px 52px rgba(0,0,0,.25); }
  .lcd { background: #B9C7A8; border-radius: 20px; padding: 24px 34px; font-family: 'Roboto Mono', monospace; color: #26301F; box-shadow: inset 0 4px 12px rgba(0,0,0,.25); }
  .lcd .ln { display: flex; justify-content: space-between; align-items: baseline; }
  .lcd .ln + .ln { margin-top: 12px; border-top: 3px dashed rgba(38,48,31,.25); padding-top: 12px; }
  .lcd .lab { font-size: 32px; font-weight: 700; }
  .lcd .val { font-size: 80px; font-weight: 700; letter-spacing: -2px; }
  .meter .btns { display: flex; justify-content: center; gap: 36px; margin-top: 26px; }
  .meter .btns span { width: 70px; height: 70px; border-radius: 50%; background: #555B58; box-shadow: inset 0 -6px 0 rgba(0,0,0,.3); }
  .s2 .h2 { margin-top: 34px; text-align: center; font-size: 100px; }
  .s2 .sub { text-align: center; font-size: 37px; margin-top: 14px; }
  .vs-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; margin-top: 28px; }
  .vs-card { background: #fff; border: 2px solid var(--borde); border-left: 8px solid var(--bad); border-radius: 24px; padding: 20px 24px; }
  .vs-card b { display: block; font-size: 27px; color: var(--bad); font-weight: 900; margin-bottom: 6px; }
  .vs-card span { font-size: 24px; color: var(--texto2); line-height: 1.28; display: block; }
  .s2 .more { margin-top: auto; text-align: center; font-size: 34px; font-weight: 700; color: var(--bosque); }

  /* 3 y 4. La app dentro de un iPhone que sale por el borde inferior */
  .s3 .h2, .s4 .h2 { font-size: 68px; }
  .app-dock { position: absolute; top: 400px; width: 650px; height: 950px; }
  .app-dock > .iphone { transform: scale(1.5663); transform-origin: top left; }
  /* Escala menor: deja ver más de la pantalla (la lista de especies o el segundo paso del plan). */
  .app-dock.wide { top: 370px; width: 500px; height: 980px; }
  .app-dock.wide > .iphone { transform: scale(1.18); }
  .callout { position: absolute; z-index: 4; background: var(--noche); color: #fff; font-size: 27px; font-weight: 700; line-height: 1.28; padding: 22px 26px; border-radius: 26px; box-shadow: 0 16px 40px rgba(18,40,31,.35); width: 375px; }
  .callout b { color: var(--brote); }
  .callout .tag-k { display: block; font-size: 19px; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase; color: var(--ocre); margin-bottom: 6px; }
  .callout::after { content: ''; position: absolute; width: 26px; height: 26px; background: var(--noche); transform: rotate(45deg); }
  .callout.left::after { right: -11px; top: 38px; }
  .callout.right::after { left: -11px; top: 38px; }

  /* 5. Beneficios (6 virtudes clave) */
  .grid6 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 32px; }
  .ben { background: rgba(255,255,255,.08); border: 2px solid rgba(111,211,160,.35); border-radius: 28px; padding: 22px 26px; display: flex; flex-direction: column; }
  .ben-head { display: flex; align-items: center; gap: 16px; }
  .ben .ic { width: 66px; height: 66px; border-radius: 20px; background: var(--brote); display: grid; place-items: center; flex: none; }
  .ben h3 { font-size: 31px; font-weight: 900; line-height: 1.12; }
  .ben p { font-size: 24px; margin-top: 10px; color: #CFE3D8; line-height: 1.28; }

  /* 6. Prueba */
  .bars { margin-top: 36px; }
  .bar { margin-bottom: 22px; }
  .bar .lab { font-size: 29px; font-weight: 700; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: baseline; }
  .bar .lab small { font-weight: 500; color: var(--texto2); font-size: 23px; }
  .bar .track { height: 74px; background: #E1E8E2; border-radius: 20px; overflow: hidden; }
  .bar .fill { height: 100%; border-radius: 20px; display: flex; align-items: center; justify-content: flex-end; padding-right: 24px; font-size: 36px; font-weight: 900; color: #fff; }
  .note { font-size: 24px; color: var(--texto2); line-height: 1.32; margin-top: 8px; }
  .badges { display: flex; gap: 20px; margin-top: auto; }
  .badge { flex: 1; text-align: center; background: var(--tarjeta); border: 2px solid var(--borde); border-radius: 26px; padding: 22px 12px; }
  .badge b { display: block; font-size: 42px; font-weight: 900; color: var(--bosque); }
  .badge span { font-size: 24px; color: var(--texto2); }

  /* 7. Acción */
  .s7 { align-items: center; text-align: center; justify-content: center; }
  .s7 .brand-hero { display: flex; align-items: center; justify-content: center; gap: 28px; margin-bottom: 42px; } .s7 .brand-hero .ic-ts { width: 124px; height: 124px; border-radius: 28px; box-shadow: 0 12px 30px rgba(0,0,0,.35); } .s7 .brand-hero .wm-ts { height: 78px; width: auto; }
  .s7 .s7-pill { padding: 12px 26px; border-radius: 40px; background: rgba(111,211,160,.14); border: 2px solid rgba(111,211,160,.4); color: var(--brote); font-size: 23px; font-weight: 800; letter-spacing: 1.3px; text-transform: uppercase; margin-bottom: 32px; }
  .s7 .h2 { font-size: 104px; }
  .cta { margin-top: 48px; display: inline-flex; align-items: center; gap: 24px; background: #25D366; color: #0B2A17; font-size: 46px; font-weight: 900; padding: 32px 56px; border-radius: 80px; box-shadow: 0 16px 40px rgba(0,0,0,.35); }
  .web { margin-top: 30px; font-size: 38px; color: #CFE3D8; } .web b { color: #fff; }
  .price { margin-top: 46px; font-size: 27px; color: var(--brote); font-weight: 800; letter-spacing: 1px; line-height: 1.45; }

  /* ================= iPhone (medidas lógicas de un iPhone 15: 393 x 852 pt) ================= */
  .iphone { width: 417px; height: 876px; border-radius: 68px; padding: 12px; position: relative;
    background: #0B0B0C; box-shadow: 0 0 0 2px #2C2C2E, 0 0 0 5px #8D8F93, 0 0 0 6px #5E6064, 0 40px 80px rgba(18,40,31,.35); }
  .iphone::before, .iphone::after { content: ''; position: absolute; width: 5px; border-radius: 3px; background: #7E8084; }
  .iphone::before { left: -9px; top: 170px; height: 64px; box-shadow: 0 84px 0 #7E8084; }
  .iphone::after { right: -9px; top: 220px; height: 100px; }
  .iscreen { width: 393px; height: 852px; border-radius: 56px; overflow: hidden; position: relative; background: #fff; font-family: var(--ios); display: flex; flex-direction: column; }
  .island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 126px; height: 37px; border-radius: 20px; background: #000; z-index: 10; }
  .sbar { height: 54px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0 52px; position: relative; z-index: 9; }
  .sbar .tm { font-size: 17px; font-weight: 600; letter-spacing: -.3px; }
  .sbar .ics { display: flex; align-items: center; gap: 6px; }
  .homebar { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 139px; height: 5px; border-radius: 3px; background: #000; z-index: 10; }

  /* ---------- Pantallas de la app (MeasurementResultFlow) ---------- */
  .appui { background: var(--fondo); color: var(--texto); }
  .a-body { padding: 0 24px; display: flex; flex-direction: column; gap: 24px; }
  .a-top { display: flex; align-items: center; justify-content: space-between; min-height: 54px; padding-right: 48px; font-size: 16px; color: var(--bosque); }
  .a-top .bk { font-weight: 600; } .a-top .sv { font-weight: 700; }
  .a-guide { position: absolute; top: 58px; right: 14px; width: 44px; height: 44px; border-radius: 22px; background: #fff; border: 1px solid var(--borde); display: grid; place-items: center; font-size: 22px; font-weight: 800; color: var(--bosque); box-shadow: 0 2px 6px rgba(0,0,0,.08); }
  .a-head { display: flex; flex-direction: column; gap: 12px; }
  .a-eyebrow { color: var(--bosque); font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
  .a-title { font-size: 38px; line-height: 44px; font-weight: 700; letter-spacing: -1.3px; }
  .a-desc { color: var(--texto2); font-size: 16px; line-height: 24px; }
  .a-kids { display: flex; flex-direction: column; gap: 12px; }
  .a-card { border-radius: 22px; border: 1px solid var(--borde); background: #fff; overflow: hidden; }
  .a-ringrow { display: flex; align-items: center; gap: 18px; padding: 18px; }
  .a-ring { width: 116px; height: 116px; position: relative; display: grid; place-items: center; flex: none; }
  .a-ring svg { position: absolute; inset: 0; }
  .a-ring .n { font-size: 26px; font-weight: 800; text-align: center; line-height: 1; } .a-ring .n small { font-size: 16px; font-weight: 600; color: var(--texto2); }
  .a-ring .l { font-size: 12px; font-weight: 600; color: var(--texto2); text-align: center; margin-top: 3px; }
  .a-leg { display: flex; flex-direction: column; gap: 8px; }
  .a-leg div { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--texto2); }
  .a-leg i { width: 10px; height: 10px; border-radius: 5px; flex: none; } .a-leg b { font-size: 15px; color: var(--texto); min-width: 16px; }
  .a-stage { display: flex; align-items: center; gap: 12px; padding: 12px; background: #17392C; }
  .a-stage .art { width: 64px; height: 48px; border-radius: 10px; overflow: hidden; flex: none; }
  .a-stage .k { color: #6EE7B7; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; } .a-stage .v { color: #fff; font-size: 16px; font-weight: 700; }
  .a-scard { border-radius: 18px; border: 1px solid var(--borde); border-left: 5px solid var(--bosque); background: #fff; padding: 18px; font-size: 16px; line-height: 24px; }
  .a-label { color: var(--bosque); font-size: 12px; font-weight: 700; letter-spacing: 1.5px; margin-top: 8px; }
  .a-tiles { display: flex; flex-wrap: wrap; gap: 12px; }
  .a-tile { width: calc(50% - 6px); min-height: 150px; border-radius: 20px; border: 1px solid var(--borde); background: #fff; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .a-tile .r { display: flex; justify-content: space-between; align-items: center; }
  .a-tile .r span { color: var(--bosque); font-size: 22px; }
  .a-badge { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; }
  .a-tile .nm { color: var(--texto2); font-size: 14px; }
  .a-tile .vl { font-size: 24px; font-weight: 800; letter-spacing: -.5px; }
  .a-tile .st { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; margin-top: auto; }
  .a-tile .st i { width: 8px; height: 8px; border-radius: 4px; }
  .a-pbar { height: 8px; border-radius: 4px; background: var(--borde); overflow: hidden; } .a-pbar div { height: 100%; border-radius: 4px; }
  .a-ph { height: 16px; position: relative; display: flex; align-items: center; }
  .a-ph .g { height: 8px; width: 100%; border-radius: 4px; background: linear-gradient(90deg, #D9534F 0%, #E8A23B 30%, #6BBF59 50%, #3B8FD9 72%, #6E4BC2 100%); }
  .a-ph .k { position: absolute; top: 0; width: 16px; height: 16px; margin-left: -8px; border-radius: 8px; background: #fff; border: 3px solid var(--texto); }
  .a-tl .it { display: flex; gap: 14px; }
  .a-tl .rail { display: flex; flex-direction: column; align-items: center; }
  .a-tl .num { width: 32px; height: 32px; border-radius: 16px; background: var(--bosque); color: #fff; font-size: 15px; font-weight: 800; display: grid; place-items: center; flex: none; }
  .a-tl .ln { flex: 1; width: 2px; background: var(--borde); margin: 4px 0; }
  .a-tl p { flex: 1; padding: 4px 0 18px; font-size: 16px; line-height: 24px; }
  .a-tl .it.hot { background: #E5F0FA; border-radius: 16px; margin: 0 -10px; padding: 8px 10px 0; box-shadow: 0 0 0 2px #3B8FD9; }
  .a-tl .it.hot p { padding-bottom: 10px; }
  .a-top .act { font-weight: 700; font-size: 16px; color: var(--bosque); }
  .a-batt { display: flex; align-items: center; gap: 8px; color: var(--texto); font-size: 15px; font-weight: 700; }
  .a-batt .cell { width: 38px; height: 18px; border-radius: 5px; border: 1.5px solid var(--ok); padding: 2px; display: block; }
  .a-batt .cell i { display: block; height: 100%; border-radius: 2.5px; background: var(--ok); }
  .a-batt .tip { width: 3px; height: 7px; margin-left: -6.5px; border-radius: 0 2px 2px 0; background: var(--ok); }
  /* Selector de especie (SpeciesPicker) */
  .sp-art { width: 100%; aspect-ratio: 360 / 150; border-radius: 20px; overflow: hidden; background: #17392C; }
  .sp-art svg { display: block; width: 100%; height: 100%; }
  .sp-bar { min-height: 68px; border-radius: 18px; border: 2px solid var(--bosque); background: #fff; padding: 10px 14px; display: flex; align-items: center; gap: 12px; }
  .sp-bar .ic { width: 42px; height: 42px; border-radius: 21px; background: #17392C; display: grid; place-items: center; flex: none; }
  .sp-bar .ph { flex: 1; color: var(--texto2); font-size: 17px; }
  .sp-bar .chev { color: var(--bosque); font-size: 18px; font-weight: 700; transform: rotate(180deg); }
  .sp-list { border-radius: 18px; border: 1px solid var(--borde); background: #fff; padding: 10px; display: flex; flex-direction: column; gap: 4px; }
  .sp-search { display: flex; align-items: center; gap: 8px; min-height: 50px; border-radius: 14px; border: 1.5px solid var(--borde); background: var(--fondo); padding-left: 14px; font-size: 16px; color: var(--texto2); }
  .sp-count { color: var(--texto2); font-size: 13px; padding: 2px 6px; }
  .sp-group { min-height: 44px; padding: 0 12px; display: flex; align-items: center; gap: 10px; }
  .sp-group .t { flex: 1; color: var(--bosque); font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
  .sp-group .n { color: var(--texto2); font-size: 13px; }
  .sp-group .c { color: var(--bosque); font-size: 16px; font-weight: 700; }
  /* Plan de recomendaciones */
  .pl-first { border-radius: 22px; border: 2px solid var(--bosque); background: #fff; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .pl-k { color: var(--bosque); font-size: 12px; font-weight: 800; letter-spacing: 1.4px; }
  .pl-chips { display: flex; align-items: center; gap: 8px; }
  .pl-chips .kd { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; letter-spacing: 1.2px; }
  .pl-chips .wh { padding: 2px 8px; border-radius: 10px; background: rgba(72,88,79,.094); color: var(--texto2); font-size: 12px; font-weight: 700; }
  .pl-first .tt { font-size: 21px; font-weight: 800; letter-spacing: -.3px; line-height: 1.25; }
  .pl-body { font-size: 16px; line-height: 24px; }
  .pl-next { display: flex; gap: 14px; border-radius: 18px; border: 1px solid var(--borde); background: #fff; padding: 16px; }
  .pl-next .nm { width: 30px; height: 30px; border-radius: 15px; display: grid; place-items: center; font-size: 14px; font-weight: 800; flex: none; }
  .pl-next .tt { font-size: 17px; font-weight: 700; line-height: 1.3; }
  .pl-next .pl-body { color: var(--texto2); }

  /* ---------- Publicación de una red social en el iPhone ---------- */
  .social { background: #fff; color: #000; }
  .p-head { display: flex; align-items: center; gap: 10px; padding: 8px 12px; height: 54px; }
  .p-av { width: 34px; height: 34px; border-radius: 17px; padding: 2px; border: 1.5px solid #DBDBDB; }
  .p-av img { width: 100%; height: 100%; border-radius: 15px; display: block; }
  .p-nm { font-size: 14px; font-weight: 600; line-height: 1.2; } .p-nm small { display: block; font-size: 12px; font-weight: 400; color: #000; }
  .p-more { margin-left: auto; }
  .p-media { width: 393px; height: 491px; position: relative; overflow: hidden; background: #ddd; flex: none; }
  .p-media .slide { position: absolute; top: 0; left: 0; transform: scale(.36389); transform-origin: top left; }
  .p-cta { display: flex; justify-content: space-between; align-items: center; height: 42px; padding: 0 12px; border-bottom: .5px solid #DBDBDB; font-size: 14px; font-weight: 600; color: #0095F6; flex: none; }
  .p-act { display: flex; align-items: center; height: 44px; padding: 0 12px; gap: 14px; position: relative; flex: none; }
  .p-dots { position: absolute; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; }
  .p-dots i { width: 6px; height: 6px; border-radius: 3px; background: #C7C7C7; } .p-dots i.on { background: #0095F6; }
  .p-bm { margin-left: auto; }
  .p-txt { padding: 0 12px; font-size: 14px; line-height: 18px; }
  .p-txt b { font-weight: 600; } .p-txt .tag { color: #00376B; } .p-txt .gr { color: #737373; font-size: 14px; margin-top: 4px; } .p-txt .tm { color: #737373; font-size: 11px; margin-top: 4px; }
  .p-tabs { position: absolute; left: 0; right: 0; bottom: 0; height: 83px; background: #fff; border-top: .5px solid #DBDBDB; display: flex; justify-content: space-around; padding-top: 12px; }
  .p-tabs .me { width: 26px; height: 26px; border-radius: 13px; overflow: hidden; border: 1px solid #DBDBDB; } .p-tabs .me img { width: 100%; height: 100%; }

  /* ================= Vistas de exportación ================= */
  .view { display: none; }
  body.v-slide .view-slide, body.v-phone .view-phone, body.v-grid .view-grid, body.v-all .view-all { display: block; }
  .view-phone { padding: 24px; }
  .view-grid { width: 1920px; height: 1080px; background: var(--fondo); padding: 120px 60px 54px; }

  /* ================= Carrusel navegable para presentar ================= */

  .view-carrusel img { pointer-events: none; }
  .c-stage { position: absolute; left: 50%; top: 50%; padding: 6px; }
  .c-media { touch-action: pan-y; cursor: grab; } .c-media:active { cursor: grabbing; }
  .c-track { display: flex; height: 100%; transition: transform .45s cubic-bezier(.25,.8,.25,1); }
  .c-track.drag { transition: none; }
  .c-cell { flex: none; position: relative; overflow: hidden; }

  .c-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 64px; height: 64px; border-radius: 50%; border: 0; background: var(--bosque); color: #fff; display: grid; place-items: center; cursor: pointer; box-shadow: 0 10px 24px rgba(18,40,31,.3); z-index: 20; transition: opacity .3s; }
  .c-nav:disabled { opacity: .2; cursor: default; }

  .view-carrusel.idle { cursor: none; }

<div class="view view-slide" id="view-slide"></div>
<div class="view view-phone" id="view-phone"></div>
<div class="view view-grid">
  <div class="g-title">Carrusel «Del número a la decisión»</div>
  <div class="g-lead">Siete imágenes que llevan al productor desde el problema hasta la conversación por WhatsApp.</div>
  <div class="g-row" id="grid-row"></div>
  <div class="g-funnel"></div>
</div>
<div class="view view-all"><div class="wrap" id="all"></div></div>
<div class="view view-carrusel" id="view-carrusel">
  <button class="c-nav c-prev" aria-label="Anterior"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <div class="c-stage"></div>
  <button class="c-nav c-next" aria-label="Siguiente"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <div class="c-hud"><span class="c-step"></span><button class="c-view">Diapositiva completa (V)</button><button class="c-full">Pantalla completa (F)</button></div>
</div>

<script>
  const tpl = id => document.getElementById(id).content;
  const steps = ['Impacto', 'Problema', 'Tu cultivo', 'Plan', 'Beneficios', 'Prueba', 'Acción'];
  // Nivel del embudo digital del informe (sección 8) al que apunta cada imagen.
  const levels = ['Atracción', 'Atracción', 'Consideración', 'Consideración', 'Consideración', 'Consideración', 'Conversión'];

  // iPhone con barra de estado de iOS, isla dinámica e indicador de inicio.
  function iphone(content) {
    const ph = document.createElement('div'); ph.className = 'iphone';
    const sc = document.createElement('div'); sc.className = 'iscreen';
    const bar = document.createElement('div'); bar.className = 'sbar';
    bar.innerHTML = '<span class="tm">9:41</span>'; bar.appendChild(tpl('ios-icons').cloneNode(true));
    sc.innerHTML = '<div class="island"></div>'; sc.appendChild(bar); sc.appendChild(content);
    sc.insertAdjacentHTML('beforeend', '<div class="homebar"></div>');
    if (content.classList && content.classList.contains('appui')) sc.style.background = 'var(--fondo)';
    ph.appendChild(sc); return ph;
  }

  // Cada diapositiva con su app (si la lleva) ya montada en un iPhone.
  function slide(i) {
    const s = tpl('slides').querySelectorAll('.slide')[i].cloneNode(true);
    s.querySelectorAll('.app-dock').forEach(d => d.appendChild(iphone(tpl(d.dataset.app).firstElementChild.cloneNode(true))));
    return s;
  }

  function post(i) {
    const p = tpl('post').firstElementChild.cloneNode(true);
    p.querySelector('.p-media').appendChild(slide(i));
    p.querySelector('.p-dots').innerHTML = steps.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('');
    return iphone(p);
  }

  // Carrusel navegable: el mismo post del iPhone, pero con las siete imágenes en una cinta
  // que se desliza. V alterna con la diapositiva completa, más legible en un proyector.
  function carrusel(start) {
    const root = document.getElementById('view-carrusel');
    const stage = root.querySelector('.c-stage');
    const prev = root.querySelector('.c-prev'), next = root.querySelector('.c-next');
    let idx = start, big = false, k = 1;

    function track(w, h) {
      const t = document.createElement('div'); t.className = 'c-track'; t.dataset.w = w;
      steps.forEach((_, j) => {
        const c = document.createElement('div'); c.className = 'c-cell';
        c.style.width = w + 'px'; c.style.height = h + 'px';
        c.appendChild(slide(j)); t.appendChild(c);
      });
      return t;
    }

    const p = tpl('post').firstElementChild.cloneNode(true);
    const media = p.querySelector('.p-media'); media.classList.add('c-media');
    media.appendChild(track(393, 491));
    const dots = p.querySelector('.p-dots'); dots.innerHTML = steps.map(() => '<i></i>').join('');
    const phone = iphone(p);
    const bigBox = document.createElement('div'); bigBox.className = 'c-big c-media';
    bigBox.appendChild(track(1080, 1350));
    // La vista oculta queda fuera del documento: se guardan ambas cintas para moverlas juntas.
    const tracks = [media, bigBox].map(el => el.querySelector('.c-track'));

    function go(n) {
      idx = Math.max(0, Math.min(steps.length - 1, n));
      tracks.forEach(t => { t.style.transform = `translateX(${-idx * t.dataset.w}px)`; });
      dots.querySelectorAll('i').forEach((d, j) => d.classList.toggle('on', j === idx));
      prev.disabled = idx === 0; next.disabled = idx === steps.length - 1;
      root.querySelector('.c-step').innerHTML = `<b>${idx + 1} / ${steps.length}</b> · ${steps[idx]}`;
    }

    function fit() {
      const w = big ? 1092 : 429, h = big ? 1362 : 888;
      k = Math.min((innerHeight - 90) / h, (innerWidth - 220) / w);
      stage.style.transform = `translate(-50%, -50%) scale(${k})`;
    }

    function setView(b) {
      big = b; stage.replaceChildren(big ? bigBox : phone);
      root.querySelector('.c-view').textContent = big ? 'Ver en el celular (V)' : 'Diapositiva completa (V)';
      fit();
    }

    function fullscreen() {
      if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen();
    }

    // Arrastrar desliza la cinta; un clic sin arrastre avanza (o retrocede en el tercio izquierdo).
    [media, bigBox].forEach(el => {
      const t = el.querySelector('.c-track');
      let x0 = null, dx = 0;
      el.addEventListener('pointerdown', e => { x0 = e.clientX; dx = 0; el.setPointerCapture(e.pointerId); t.classList.add('drag'); });
      el.addEventListener('pointermove', e => {
        if (x0 === null) return;
        dx = e.clientX - x0;
        t.style.transform = `translateX(${-idx * t.dataset.w + dx / k}px)`;
      });
      const end = e => {
        if (x0 === null) return;
        x0 = null; t.classList.remove('drag');
        if (Math.abs(dx) > 40) go(idx + (dx < 0 ? 1 : -1));
        else if (e.type === 'pointerup') {
          const r = el.getBoundingClientRect();
          go(idx + (e.clientX < r.left + r.width / 3 ? -1 : 1));
        } else go(idx);
      };
      el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
    });

    prev.addEventListener('click', () => { prev.blur(); go(idx - 1); });
    next.addEventListener('click', () => { next.blur(); go(idx + 1); });
    root.querySelector('.c-view').addEventListener('click', e => { e.target.blur(); setView(!big); });
    root.querySelector('.c-full').addEventListener('click', e => { e.target.blur(); fullscreen(); });

    // Teclado y control remoto de presentaciones (envían flechas o Re Pág / Av Pág).
    addEventListener('keydown', e => {
      const fwd = ['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'], back = ['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'];
      if (fwd.includes(e.key)) go(idx + 1);
      else if (back.includes(e.key)) go(idx - 1);
      else if (e.key === 'Home') go(0);
      else if (e.key === 'End') go(steps.length - 1);
      else if (e.key === 'v' || e.key === 'V') setView(!big);
      else if (e.key === 'f' || e.key === 'F') fullscreen();
      else return;
      e.preventDefault();
    });

    // Flechas y botones se ocultan cuando el mouse queda quieto.
    let idle;
    addEventListener('pointermove', () => {
      root.classList.remove('idle'); clearTimeout(idle);
      idle = setTimeout(() => root.classList.add('idle'), 2500);
    });

    addEventListener('resize', fit);
    setView(false); go(idx);
  }

  const [mode, n] = (location.hash.slice(1) || 'carrusel').split('-');
  const i = Math.max(0, Math.min(steps.length - 1, (parseInt(n, 10) || 1) - 1));
  document.body.className = 'v-' + mode;
  if (mode === 'slide') document.getElementById('view-slide').appendChild(slide(i));
  if (mode === 'phone') document.getElementById('view-phone').appendChild(post(i));
  if (mode === 'grid') steps.forEach((name, k) => {
    const c = document.createElement('div'); c.className = 'g-cell';
    c.innerHTML = `<div class="g-step"><i>${k + 1}</i>${name}</div><div class="g-wrap"></div><div class="g-lvl">${levels[k]}</div>`;
    c.querySelector('.g-wrap').appendChild(post(k));
    document.getElementById('grid-row').appendChild(c);
  });
  if (mode === 'all') steps.forEach((_, k) => document.getElementById('all').appendChild(post(k)));
  if (mode === 'carrusel') carrusel(i);
</script>
