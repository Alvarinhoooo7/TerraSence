name: Disponibilidad de Supabase

on:
  schedule:
    - cron: '23 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Comprobar Auth y consultar PostgreSQL
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node supabase/scripts/check-health.mjs
