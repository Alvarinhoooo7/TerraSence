          - paragraph [ref=f4e142]:
            - text: "* Laboratories report soil test levels as either lb/ac or ppm. NC uses \"index\" values above which nutrients are not generally recommended. Ca/Mg levels are maintained by liming to optimum soil pH. Fe deficiencies are not common in NC."
            - link "↵" [ref=f4e143] [cursor=pointer]:
              - /url: "#Table11-1Footnote*Ref"
          - paragraph [ref=f4e144]:
            - text: "** K recommendations from Oregon State are higher (300 to 600 lb/ac). Since K is relatively immobile in soil, higher rates might be needed. Apply 12 in. away from base of new plants to prevent salt injury."
            - link "↵" [ref=f4e145] [cursor=pointer]:
              - /url: "#Table11-1Footnote**Ref"
          - paragraph [ref=f4e146]:
            - text: "*** Optimum calcium levels depend on soil type. Maintain optimum soil pH (6.0 to 6.5) with liming supplies that have sufficient Ca and Mg."
            - link "↵" [ref=f4e147] [cursor=pointer]:
              - /url: "#Table11-1Footnote***Ref"
          - paragraph [ref=f4e148]: Depending on leaf tissue P, K, and other nutrient levels, 30 to 60 lb P2O5 and/or K2O/ac can be applied in the fall or early spring before re-growth, whichever is most convenient. Adjust P and K rates as needed according to the tissue analysis. Blackberry has a higher annual K nutrient need than P, and thus P maybe be required less frequently.
          - paragraph [ref=f4e149]:
            - emphasis [ref=f4e150]: Third and subsequent years
            - text: . Increase total N rate to 60 to 80 lb N/ac, with the split applied as outlined above for second year plants. If the leaf tissue analyses suggest that P and K are still below optimum levels (
            - link "Table 11-1" [ref=f4e151] [cursor=pointer]:
              - /url: "#Table11-1"
            - text: ), continue to apply as described for the second-year crop.
          - paragraph [ref=f4e152]:
            - emphasis [ref=f4e153]: "Important:"
            - text: Routinely use leaf analysis to assess sufficient levels of N and other nutrients, regardless of plant age or production year (see
            - link "Leaf Analysis" [ref=f4e154] [cursor=pointer]:
              - /url: "#section_heading_7011"
            - text: below).
        - generic [ref=f4e155]:
          - generic [ref=f4e156]:
            - heading "Raspberry Fertilization" [level=2] [ref=f4e157]
            - link " Skip to Raspberry Fertilization" [ref=f4e159] [cursor=pointer]:
              - /url: "#section_heading_7010"
              - generic [ref=f4e160]: 
              - generic [ref=f4e161]: Skip to Raspberry Fertilization
          - paragraph [ref=f4e162]:
            - text: As described above, assure that soil pH, P, and K levels are adjusted to optimum levels before planting based on soil test recommendations (
            - link "Table 11-1" [ref=f4e163] [cursor=pointer]:
              - /url: https://content.ces.ncsu.edu/southeast-regional-caneberry-production-guide/fertility-management#Table11-1
            - text: ). After the establishment year, use similar P and K recommendations to maintain tissue P and K levels as described for blackberries.
          - paragraph [ref=f4e164]:
            - emphasis [ref=f4e165]: First year.
            - text: Two to four weeks after planting, apply ½ to ⅔ of 25 to 50 lb N/ac, with the balance about 30 to 60 days later. Broadcast N about 6 to 12 in. from plant in 6 to 12 in. wide strips on each side of the row in the weed-free zone. If using a drip irrigation, N and other nutrients can be split applied at the recommended rates weekly or as needed.
          - paragraph [ref=f4e166]:
            - emphasis [ref=f4e167]: Second year.
            - text: Broadcast apply ½ to ⅔ of 40 to 80 lb N/ac at the onset of bloom, with the remainder applied immediately after harvest (summer-bearing cultivars). Total N should not exceed 50 to 60 lb N/ac. Apply ½ to ⅔ of the total N when primocanes begin to emerge, with the remaining N applied 60 days later (primocane-fruiting cultivars).
          - paragraph [ref=f4e168]:
            - emphasis [ref=f4e169]: Third and subsequent years
            - text: (summer bearing and primocane-fruiting cultivars). Split apply 40 to 80 lb N/ac, with ½ to ⅔ of total N amount at the onset of bloom and the remainder immediately after harvest (summer bearing cultivars) or when the first new primocanes emerge and the remainder about 60 days later (primocane-fruiting cultivars).
          - paragraph [ref=f4e170]:
            - text: For established plantings, broadcast N in the weed-free zone in at least 6 to 12 in. wide strips on each side of the row. With fertigation (application of fertilizer with irrigation water), apply N weekly beginning at the onset of bloom and through harvest for summer-bearing cultivars or until late August for primocane-bearing cultivars. Use leaf N analysis to assess sufficiency levels of N and other nutrients (see
            - link "Leaf Analysis" [ref=f4e171] [cursor=pointer]:
              - /url: "#section_heading_7011"
            - text: below).
        - generic [ref=f4e172]:
          - generic [ref=f4e173]:
            - heading "Leaf Analysis" [level=2] [ref=f4e174]
            - link " Skip to Leaf Analysis" [ref=f4e176] [cursor=pointer]:
              - /url: "#section_heading_7011"
              - generic [ref=f4e177]: 
              - generic [ref=f4e178]: Skip to Leaf Analysis
          - paragraph [ref=f4e179]: In established caneberries, the correlation between soil test levels and plant nutrient status tends to be poor because plants access nutrients throughout the rooting zone, while soil tests are based on a surface soil sampling depth (0 to 6, or 0 to 8 in. depth). Despite this limitation, soil testing at regular intervals (every two to three years) is essential to monitor and adjust soil pH to optimum levels. With most perennial, woody plants, leaf analysis provides an accurate measure of the nutrient status of the plant. Therefore, annual leaf analysis, combined with periodic soil testing and field observations of plant growth and fruiting, are all needed to develop and maintain an effective nutrient management program.
          - paragraph [ref=f4e180]: "As with soil testing, the reliability of leaf analysis depends on following tissue sampling guidelines:"
          - list [ref=f4e181]:
            - listitem [ref=f4e182]:
              - paragraph [ref=f4e183]: Collect leaves from only one cultivar per sample, preferably from plants of similar age.
            - listitem [ref=f4e184]:
              - paragraph [ref=f4e185]: Plants included in a sample should be growing on relatively uniform field areas of similar soils and slope positions. Since inclusion of samples from widely variable areas may not accurately represent plant nutrient status, it is important to sample from smaller areas to ensure reliable results.
            - listitem [ref=f4e186]:
              - paragraph [ref=f4e187]: Collect leaves from healthy plants. Leaves showing signs of disease or insect damage, or different growth characteristics, should be avoided or sampled separately.
            - listitem [ref=f4e188]:
              - paragraph [ref=f4e189]: Sample the most recently mature leaf on primocanes shortly after harvest for summer-bearing cultivars. In primocane-fruiting cultivars, sample the most recent fully expanded leaf on primocane branches at the green to red fruit stage (usually late July to August).
            - listitem [ref=f4e190]:
              - paragraph [ref=f4e191]: Collect 50 to 100 leaves (one leaf per cane) from the most recently mature leaf which is generally located on the sixth to tenth nodes on primocanes in mid to late July.
            - listitem [ref=f4e192]:
              - paragraph [ref=f4e193]:
                - text: Collect leaf samples
                - emphasis [ref=f4e194]: before
                - text: a spray application and not shortly after. If leaves are dusty or have spray residue, rinse lightly in distilled water, blot dry, and place them in a clean paper bag. Allow leaves to air dry in a dust-free area before sending to the lab for analysis.
            - listitem [ref=f4e195]:
              - paragraph [ref=f4e196]: Before sampling, contact the laboratory website for additional detailed sampling and handling instructions.
          - paragraph [ref=f4e197]: General nutrient sufficiency levels in caneberry leaves are shown in Table 11-2.
          - table "Table 11-2. Plant nutrient sufficiency ranges for fruit crops." [ref=f4e199]:
