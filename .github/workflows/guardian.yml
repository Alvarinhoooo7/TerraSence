name: Guardian

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: guardian-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Reject environment and private-key files
        shell: bash
        run: |
          set -euo pipefail
          forbidden_env="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v -E '(^|/)\.env\.example$' || true)"
          forbidden_keys="$(git ls-files | grep -Ei '\.(pem|key|p8|p12|jks|keystore|mobileprovision)$' || true)"
          if [[ -n "$forbidden_env" || -n "$forbidden_keys" ]]; then
            echo '::error::Se detectaron archivos de entorno o claves privadas versionados.'
            printf '%s\n%s\n' "$forbidden_env" "$forbidden_keys"
            exit 1
          fi
      - name: Validate Git whitespace
        run: git diff --check HEAD^

  app:
    name: Mobile app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: App/package-lock.json
      - run: npm ci
      - name: Audit production dependencies
        run: node scripts/check-npm-audit.mjs
      - run: npm test
      - run: npm run type-check
      - name: Validate Expo dependencies and configuration
        run: npx expo-doctor

  web:
    name: Web console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Web/package-lock.json
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run type-check
      - run: npm run build
