                - paragraph [ref=f13e600]:
                  - strong [ref=f13e601]: "Base saturation:"
                  - text: Ca should roughly equal the sum of K and Mg. Base saturation is the proportion of the various positive cations in the soil. In acid soils, 45-70% should consist of hydrogen ions (these replace much of the Ca that would be found in higher pH soils).
                - paragraph [ref=f13e602]:
                  - strong [ref=f13e603]: "Cation Exchange Capacity (CEC):"
                  - text: Measures ability of soil to hold positive ions (cations or bases). If CEC is low (<10), base saturation proportions are important. If CEC is high and all cations are in the normal range, the proportions in the base saturation are less critical.
                  - emphasis [ref=f13e604]
                - paragraph [ref=f13e605]:
                  - emphasis [ref=f13e606]: If soil iron is above 200 ppm, soil P tests will not accurately reflect P availability.
                - heading "IMPORTANT CONSIDERATIONS FOR CRANBERRY NUTRITION" [level=2] [ref=f13e607]
                - list [ref=f13e608]:
                  - listitem [ref=f13e609]:
                    - text: REVIEW the Nutrient Management BMP in the Best Management Practices Guide for Massachusetts Cranberry Production on our website (
                    - link "http://ag.umass.edu/cranberry/publications-resources/best-management-pr…" [ref=f13e610] [cursor=pointer]:
                      - /url: http://ag.umass.edu/cranberry/publications-resources/best-management-practices
                    - text: ). Excellent information and decision trees for planning N and P management are available as well (
                    - link "http://ag.umass.edu/cranberry/publications-resources/books-pamphlets" [ref=f13e611] [cursor=pointer]:
                      - /url: http://ag.umass.edu/cranberry/publications-resources/books-pamphlets
                    - text: ). Select Nitrogen or Phosphorus for Bearing Cranberries articles.
                  - listitem [ref=f13e612]:
                    - text: The Cranberry Station website has an entire page devoted to Nutrient Management and planning (
                    - link "http://ag.umass.edu/cranberry/publications-resources/nutrient-managemen…" [ref=f13e613] [cursor=pointer]:
                      - /url: http://ag.umass.edu/cranberry/publications-resources/nutrient-management-for-cranberries
                    - text: ). There are templates for record keeping and nutrient calculator tools that can be downloaded from that page.
                  - listitem [ref=f13e614]:
                    - text: GOOD DRAINAGE AND ADEQUATE IRRIGATION are essential for best response to fertilizer. Monitor and maintain adequate soil moisture. Small, frequent irrigations may not be adequate to provide moisture to the root zone. For further information, refer to the Irrigation section (pg 93) and BMP
                    - link "https://ag.umass.edu/cranberry/publications-resources/best-management-p…" [ref=f13e615] [cursor=pointer]:
                      - /url: https://ag.umass.edu/cranberry/publications-resources/best-management-practices
                    - text: .
                  - listitem [ref=f13e616]: KEEP GOOD RECORDS. Comparison of rate/material and crop response over time will help to refine fertilizer practices tailored to YOUR bog. OBSERVE YOUR BOGS OFTEN -- fertilizer timing depends on growth stage/plant development. Rate can be refined as plants respond during the growing season. For growers managing 10 acres or more, records of nutrient applications are required under Massachusetts regulations.
                  - listitem [ref=f13e617]: Cranberry bog soil has little capacity to HOLD cations (e.g., K, Mg, Ca). Much of the holding capacity is taken up by hydrogen ions. It is important to maintain a BALANCE among cations. Overuse of one can induce deficiency of the others. When you test bog soil for pH, check this balance as well.
                  - listitem [ref=f13e618]: WHEN SYMPTOMS OCCUR - rule out water management issues, disease, and pest problems first. Then look at nutrition. Collect tissue for testing if necessary.
                - heading "CAUTIONS:" [level=3] [ref=f13e619]
                - list [ref=f13e620]:
                  - listitem [ref=f13e621]: PRESERVE SURFACE WATER QUALITY - avoid applying fertilizer to water in ditches and canals. As possible, lower water levels in ditches prior to fertilizer application and impound water during and after fertilizer applications.
                  - listitem [ref=f13e622]: AVOID HIGH RATES APPLIED AT ONE TIME, particularly on bogs constructed on mineral soils or very sandy bogs. Such applications may lead to lateral movement of fertilizer into water.
                  - listitem [ref=f13e623]: EXCESSIVE NITROGEN FERTILIZATION leads to over vegetative plants. This may increase susceptibility to disease, spring frost or insect feeding. High nitrogen rates are associated with poor fruit quality and may delay color development in the fruit. High nitrogen rates can have adverse carry-over effects in following years -- excess applied nitrogen leads to high nitrogen concentrations in plant tissues such as stems and roots that can be remobilized in the plant and lead to excess vegetation, particularly when more nitrogen is added to the soil.
                  - listitem [ref=f13e624]: FALL FERTILIZER (after harvest application) is not recommended, particularly if crop was small and no deficiencies have been noted. Late-season applications may not be properly taken up by the plants depending on soil temperature and state of dormancy. Generally, if uptake does not occur in the fall, the nutrients are no longer available the following spring. Organic types of fertilizers may be the exception. If you choose to use fall fertilizer, use low N and low or no P formulations.
                - heading "EFFECTS OF WEATHER:" [level=3] [ref=f13e625]
                - list [ref=f13e626]:
                  - listitem [ref=f13e627]: WINTER INJURY. If leaf drop occurs after withdrawal of winter flood, early spring fertilizer applications will aid in recovery by encouraging rapid, early production of new leaves. Do not skip spring fertilizer. SulPoMag (or similar material) at 100-200 lb/A may also aid recovery.
                  - listitem [ref=f13e628]: COLD SOIL/AIR TEMPERATURES, particularly in the spring, will lessen or eliminate response of cranberry plants to fertilizer applications. If plants are already under stress, they may respond even less. If this occurs, care should be taken not to reapply before you are sure that the plants are not going to respond to the initial application. Soil temperatures should rise to 55°F before application of fertilizer to ensure response. If long-lasting, slow-release, controlled release, or organic forms were used, reapplication may not be necessary -- response may only be delayed.
                  - listitem [ref=f13e629]: IF FLOWER BUDS ARE DAMAGED BY SPRING FROST, high N rates can lead to overgrowth. Use lower rates.
                - heading "EFFECTS OF PESTS AND CULTURAL PRACTICES:" [level=3] [ref=f13e630]
                - list [ref=f13e631]:
                  - listitem [ref=f13e632]: BOGS CONSTRUCTED ON MINERAL SOILS without a permeability restricting or confining layer have little ability to hold nutrients in the root zone. Use organic or slow-release N and avoid large rates applied all at once.
                  - listitem [ref=f13e633]: DECREASE fertilizer rate if the bog has been SANDED. Sanding promotes production of new vegetative uprights from the runners. Sanding combined with high fertilizer rates can lead to overgrowth.
                  - listitem [ref=f13e634]: DECREASE fertilizer rate if late water has been held. Spring fertilizer rate may be eliminated on late water bogs. Overall fertilizer rate may be decreased 30% or more. However, do not decrease fertilizer N by more than 40% at the risk of adverse impact on the following season crop.
                  - listitem [ref=f13e635]: ELIMINATE fertilizer applications for the entire season if the bog has been subjected to a long SUMMER FLOOD (May-July, see Insect section) for grub control.
                  - listitem [ref=f13e636]: If eliminating crop using a FLASH FLOOD, reduce fertilizer rate. Two low-rate applications, in the spring and mid-season, should suffice to support the plants.
                  - listitem [ref=f13e637]: PRUNING stimulates growth - reduce spring fertilizer on heavily pruned bogs. However, if the bog has been mowed, fertilizer applications are required to encourage the production of new uprights.
                - heading "Calculating Fertilizer N and P Rates -- important for planning" [level=3] [ref=f13e638]
                - paragraph [ref=f13e639]: Fertilizer labels have three numbers that are N-P-K. These numbers are percent by weight, and also the amount per 100 lbs of fertilizer.
                - generic [ref=f13e640]:
                  - paragraph [ref=f13e641]:
                    - strong [ref=f13e642]: Nitrogen (N)
                    - text: "- First number on the bag is percent N"
                  - paragraph [ref=f13e643]:
                    - emphasis [ref=f13e644]: N example
                    - text: ": You have a 50 pound bag of"
                    - strong [ref=f13e645]: "18"
                    - text: – 8 – 18
                  - paragraph [ref=f13e646]: "To figure out how much N is in the bag of fertilizer:"
                  - list [ref=f13e647]:
                    - listitem [ref=f13e648]:
                      - text: Multiply the first number by weight of the bag
                      - list [ref=f13e649]:
                        - listitem [ref=f13e650]: 18 x 50 = 900
                    - listitem [ref=f13e651]:
                      - text: Because the number on the bag is a percentage, you then divide by 100 to calculate how much nitrogen you are applying
                      - list [ref=f13e652]:
                        - listitem [ref=f13e653]: 900/100 = 9
                  - paragraph [ref=f13e654]: For every 50 lbs of this fertilizer, you are adding 9 lbs of N.
                  - paragraph [ref=f13e655]:
                    - strong [ref=f13e656]: shortcut
                    - text: "- for a 100 pound application - the first number is pounds applied on the bog."
                - paragraph [ref=f13e657]
                - generic [ref=f13e658]:
                  - paragraph [ref=f13e659]:
                    - strong [ref=f13e660]: Phosphorus (P)
                    - text: "- Middle number on the bag is percent phosphorus as"
                    - emphasis [ref=f13e661]:
                      - text: phosphate - P
                      - subscript [ref=f13e662]: "2"
                      - text: O
                      - subscript [ref=f13e663]: "5"
                  - paragraph [ref=f13e664]:
                    - emphasis [ref=f13e665]: P example
                    - text: ": You have a 50 pound bag of 12 –"
                    - strong [ref=f13e666]: "24"
                    - text: – 12
                  - paragraph [ref=f13e667]:
                    - text: To figure out how much
                    - strong [ref=f13e668]: actual
                    - text: "P is in the bag of fertilizer:"
                  - list [ref=f13e669]:
                    - listitem [ref=f13e670]:
                      - text: Multiply the second number on the bag by 0.44 (conversion factor)
                      - list [ref=f13e671]:
                        - listitem [ref=f13e672]: 24 x 0.44 (conversion factor) = 10.56
                    - listitem [ref=f13e673]:
                      - text: Multiply this number by weight of the bag
                      - list [ref=f13e674]:
                        - listitem [ref=f13e675]: 10.56 x 50 (weight of the bag) = 528
                    - listitem [ref=f13e676]:
                      - text: Because the number on the bag is a percentage, you then divide by 100 to calculate how much P you are applying
                      - list [ref=f13e677]:
                        - listitem [ref=f13e678]: 528/100 = 5.28
                  - paragraph [ref=f13e679]: For every 50 lbs of this fertilizer, you are adding 5.28 lbs of P.
                  - paragraph [ref=f13e680]:
                    - strong [ref=f13e681]: "NOTE:"
                    - text: if you want less than 20 pounds actual P on the bog, limit to no more than 45 pounds of phosphate.
                - paragraph [ref=f13e682]
                - generic [ref=f13e683]:
                  - paragraph [ref=f13e684]:
                    - strong [ref=f13e685]: Potassium (K)
                    - text: "- Last number on the bag is percent potassium as"
                    - emphasis [ref=f13e686]:
                      - text: potassium oxide - K
                      - subscript [ref=f13e687]: "2"
                      - text: O
                  - paragraph [ref=f13e688]:
                    - emphasis [ref=f13e689]: K example
                    - text: ": You have a 50 pound bag of 0 – 0 –"
                    - strong [ref=f13e690]: "22"
                  - paragraph [ref=f13e691]:
                    - text: To figure out how much
                    - strong [ref=f13e692]: actual
                    - text: "K is in the bag of fertilizer:"
                  - list [ref=f13e693]:
                    - listitem [ref=f13e694]:
                      - text: Multiply the third number on the bag by 0.83 (conversion factor)
                      - list [ref=f13e695]:
                        - listitem [ref=f13e696]: 22 x 0.83 (conversion factor) = 18.26
                    - listitem [ref=f13e697]:
                      - text: Multiply this number by weight of the bag
                      - list [ref=f13e698]:
                        - listitem [ref=f13e699]: 18.26 x 50 (weight of the bag) = 913
                    - listitem [ref=f13e700]:
                      - text: Because the number on the bag is a percentage, you then divide by 100 to calculate how much K you are applying
                      - list [ref=f13e701]:
                        - listitem [ref=f13e702]: 913/100 = 9.13
                  - paragraph [ref=f13e703]: For every 50 lbs of this fertilizer, you are adding 9.13 lbs of K.
                - heading "Nutrient Planning Example" [level=3] [ref=f13e704]
                - paragraph [ref=f13e705]: Since we fertilize based on nitrogen -- decide how much N you need. Then choose a fertilizer and calculate how much N, P, and K you will apply.
                - paragraph [ref=f13e706]: My bog requires 35 lb N/A; I want to use 12-24-12. To get 35 lb N -- how much 12-24-12 do I need per acre?
                - list [ref=f13e707]:
                  - listitem [ref=f13e708]: Divide rate of N needed by percent N (first number on bag)
                  - listitem [ref=f13e709]: Then multiply by 100 to convert the percent into lbs
                - table "Calculating Fertilizer Application Rate to Meet Nitrogen Needs" [ref=f13e711]:
