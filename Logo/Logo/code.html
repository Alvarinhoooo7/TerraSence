<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <style>
      .brand-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 800; font-size: 52px; fill: #0f2e22; letter-spacing: -0.5px; }
      .brand-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #16a34a; letter-spacing: 5px; }
    </style>
  </defs>

  <!-- FONDO 100% TRANSPARENTE: Sin rectángulos de fondo ni capas opacas -->

  <!-- ISOTIPO: Minimalist Geometric Soil Probe + Horizon + Sprout (Exactamente el oficial seleccionado) -->
  <g transform="translate(130, 115)">
    <!-- Soil Stratum Horizon lines -->
    <!-- Horizon 1 (Ground surface) -->
    <line x1="20" y1="120" x2="200" y2="120" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <!-- Horizon 2 (Root / Active sensing zone) -->
    <line x1="45" y1="155" x2="175" y2="155" stroke="#CBD5E1" stroke-width="2.5" stroke-dasharray="6 6" stroke-linecap="round"/>
    <!-- Horizon 3 (Deep moisture boundary) -->
    <line x1="70" y1="190" x2="150" y2="190" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round"/>

    <!-- Sensor Probe Tip / Hardware Pin entering soil -->
    <path d="M 110 90 L 110 205 L 110 215" stroke="#047857" stroke-width="6" stroke-linecap="round"/>
    <!-- Probe sharp penetration point -->
    <polygon points="105,212 115,212 110,224" fill="#047857"/>

    <!-- Sensor Calibration Ring / Depth bands on probe -->
    <rect x="106" y="132" width="8" height="4" rx="2" fill="#10b981"/>
    <rect x="106" y="167" width="8" height="4" rx="2" fill="#10b981"/>

    <!-- Plant / Foliage geometry rising upwards from probe collar -->
    <!-- Left Leaf (Pure geometric leaf arc) -->
    <path d="M 110 95 C 75 90 55 55 65 15 C 95 15 110 55 110 95 Z" 
          fill="#15803D" />

    <!-- Right Leaf (Lighter tone, technical balance) -->
    <path d="M 110 75 C 135 70 160 40 150 5 C 125 5 110 40 110 75 Z" 
          fill="#22C55E" />

    <!-- Pure central stem signal node -->
    <circle cx="110" cy="95" r="4" fill="#FFFFFF"/>
    <circle cx="110" cy="95" r="2" fill="#047857"/>
  </g>

  <!-- LOGOTYPE & WORDMARK: TerraSense + SOIL TECHNOLOGIES -->
  <g transform="translate(370, 226)">
    <text x="0" y="0" class="brand-title">Terra<tspan fill="#16a34a">Sense</tspan></text>
    <text x="2" y="32" class="brand-sub">SOIL TECHNOLOGIES</text>
  </g>
</svg>
