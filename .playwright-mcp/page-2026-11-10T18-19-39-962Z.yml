        - heading "Fertility Management" [level=1] [ref=f4e52]
      - generic [ref=f4e53]:
        - generic [ref=f4e54]:
          - generic [ref=f4e55]:
            - heading "General" [level=2] [ref=f4e56]
            - link " Skip to General" [ref=f4e58] [cursor=pointer]:
              - /url: "#section_heading_7008"
              - generic [ref=f4e59]: 
              - generic [ref=f4e60]: Skip to General
          - paragraph [ref=f4e61]:
            - text: Before planting, soil samples should be collected. From those results, a nutrient management plan should be developed and appropriate amendments need to be applied to the soil. If the soil pH is below optimum pH from 6.0 to 6.5, lime must be applied in the fall before planting to allow sufficient time for the lime to react with the soil. If you use pelletized lime, early spring application (two to three months before planting) is sufficient. Regardless of the source, broadcast lime should be incorporated from 3 to 4 in. deep. If soil tests are below recommended levels (
            - link "Table 11-1" [ref=f4e62] [cursor=pointer]:
              - /url: https://content.ces.ncsu.edu/southeast-regional-caneberry-production-guide/fertility-management#Table11-1
            - text: ), P, K, and other nutrients (for N see below) should also be applied before planting. Broadcast apply 30 to 60 lb P2O5, K2O/ac, or both depending on soil test for P and K, followed by incorporation to distribute the material through the soil profile and to enhance availability to shallow plant roots. Failure to amend the soil to achieve optimum pH and nutrient supply could compromise your crop yield and quality.
          - paragraph [ref=f4e63]: Nitrogen (N) must be applied annually (see below) with subsequent leaf analysis to assure N sufficiency. In established crops, leaf analysis is also essential to determine if additional plant nutrients should be applied to the soil or leaves. For example, based on previous years' plant tissue levels, reapply P, K, and other nutrients before spring regrowth to optimize nutrient supply. Maintaining plant analysis records from previous years and growing season observations of leaf color, cane growth, and crop load are useful in determining efficient nutrient rates.
        - generic [ref=f4e64]:
          - generic [ref=f4e65]:
            - heading "Blackberry Fertilization" [level=2] [ref=f4e66]
            - link " Skip to Blackberry Fertilization" [ref=f4e68] [cursor=pointer]:
              - /url: "#section_heading_7009"
              - generic [ref=f4e69]: 
              - generic [ref=f4e70]: Skip to Blackberry Fertilization
          - paragraph [ref=f4e71]:
            - emphasis [ref=f4e72]: First year.
            - text: Beginning two to four weeks after planting, apply 10 to 25 lb of N per acre (10 to 25 lb N/ac), with a second application four to six weeks later. Split N application is preferred to a one-time single application to increase applied N recovered by the plant and reduce N losses. Total N over the entire first growing season should not exceed 20 to 50 lb N/ac, with higher N rates suggested for irrigated, sandy soils. With broadcast N, apply the product in a narrow 6 to 12 in. wide strip on each side of the row in the weed-free zone. To minimize potential salt damage to young plants, maintain N applications at least 6 to 12 in. away from the base of the plants. When fertilizing individual plants, apply the N product 6 to 12 in. from the base of the plant in a 6 to 12 in. wide circle around the plant. Recommended N rates can also be split and applied through the drip irrigation system on a weekly basis.
          - paragraph [ref=f4e73]:
            - emphasis [ref=f4e74]: Second year.
            - text: Increase total N rate to 50 to 80 lb N/ac. Split apply with ½ to ⅔ of total N rate applied in early spring (March) when primocane emergence begins, and the second application (10 to 30 lb N/a) immediately after harvest for floricane-fruiting cultivars. As in the first year, apply N in the weed-free area on each side of the row, away from the plant base as described above. With drip irrigation, N can be portioned on a weekly basis from March through May. Higher N rates should be used on irrigated, coarse-textured sandy soils. Apply 10 to 30 lb N immediately after harvest, but before early fall. Post-harvest primocane leaf analysis should be used to assess N sufficiency. Monitor seasonal growth and adjust N appropriately to achieve optimal growth. The N rates should be reduced if excessive vegetative growth is observed.
