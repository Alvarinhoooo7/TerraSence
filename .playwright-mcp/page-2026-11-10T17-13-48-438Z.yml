    - main "Main content" [ref=f13e104]:
      - generic [ref=f13e105]:
        - generic [ref=f13e106]:
          - heading "Nutrition Management for Producing Bogs" [level=1] [ref=f13e108]
          - article [ref=f13e110]:
            - generic [ref=f13e111]:
              - generic [ref=f13e113]:
                - paragraph [ref=f13e114]:
                  - emphasis [ref=f13e115]:
                    - strong [ref=f13e116]: Prepared by Carolyn J. DeMoranville, K.M. Ghantous, and P. Jeranyama
                - generic [ref=f13e117]:
                  - paragraph [ref=f13e118]:
                    - strong [ref=f13e119]: In this Chapter
                  - list [ref=f13e120]:
                    - listitem [ref=f13e121]:
                      - link "Tools for Nutrient Management" [ref=f13e122] [cursor=pointer]:
                        - /url: "#tools"
                    - listitem [ref=f13e123]:
                      - link "NITROGEN (N)" [ref=f13e124] [cursor=pointer]:
                        - /url: "#N"
                    - listitem [ref=f13e125]:
                      - link "PHOSPHORUS (P)" [ref=f13e126] [cursor=pointer]:
                        - /url: "#P"
                    - listitem [ref=f13e127]:
                      - link "POTASSIUM (K)" [ref=f13e128] [cursor=pointer]:
                        - /url: "#K"
                    - listitem [ref=f13e129]:
                      - link "OTHER ELEMENTS" [ref=f13e130] [cursor=pointer]:
                        - /url: "#other"
                    - listitem [ref=f13e131]:
                      - link "APPLYING FERTILIZER TO CRANBERRY BOGS" [ref=f13e132] [cursor=pointer]:
                        - /url: "#APPLYING_FERTILIZER"
                    - listitem [ref=f13e133]:
                      - link "SOIL AND TISSUE TESTS" [ref=f13e134] [cursor=pointer]:
                        - /url: "#Soil_and_tissue_tests"
                    - listitem [ref=f13e135]:
                      - link "IMPORTANT CONSIDERATIONS FOR CRANBERRY NUTRITION" [ref=f13e136] [cursor=pointer]:
                        - /url: "#important_considerations"
                - paragraph [ref=f13e137]: The Commonwealth of Massachusetts 330 CMR 31.00 Plant Nutrient Application Requirements for Agricultural Land and Land Not Used for Agricultural Purposes took effect in 2018. The regulation requires that nutrient management plans for agricultural lands, including cranberry, will be based on plant needs (as determined by testing and research) and UMass Extension recommendations. This section of the Chart Book encompasses UMass Extension recommendations for cranberry nutrient management. Use of these recommendations constitutes a Nutrient Management Plan as required in the regulations. Having a copy of the Chart Book and the required records of your applications satisfies the final version of the regulatory requirements – you are not required to have a separate written plan.
                - heading "Tools for Nutrient Management" [level=2] [ref=f13e138]
                - paragraph [ref=f13e139]:
                  - text: The Cranberry Station website provides information regarding nutrient management planning and record keeping based on Chart Book recommendations. To view these resources, follow the 'Nutrient Management for Cranberries' Quick Link on our home page (
                  - link "http://ag.umass.edu/cranberry" [ref=f13e140] [cursor=pointer]:
                    - /url: http://ag.umass.edu/cranberry
                  - text: ). Resources include a plan template and Excel files with sample record keeping formats and nutrient calculators (determine fertilizer rates based on how much nutrient you want to apply). Growers may also choose to use the BOGS system, available from the Cape Cod Cranberry Growers Association. It is an online tool designed to plan and keep records that meet regulatory requirements for pesticide and nutrient applications.
                - paragraph [ref=f13e141]: Plants are primarily made up of carbon compounds (the products of photosynthesis) and water. Mineral elements, the materials provided in fertilizer and the soil, are present in much smaller quantity, making up only about 10% of the plants' dry mass. The essential mineral elements required for the plant to grow, develop, and produce fruit need to be provided in the right amounts, in the right form and at the right time. Management must be flexible, adjusted for changing weather and observations of the plants. It should also be implemented in an environmentally sound way.
                - paragraph [ref=f13e142]: Cranberry is a perennial plant. As such, many of the mineral elements and carbon compounds are stored over the winter in stems and roots, then remobilized to support new growth in the spring. In addition, decaying plant material in the soil can provide minerals, especially Nitrogen (N) and Phosphorus (P), back to the growing plants. In a mature cranberry bed, these processes account for about half of the plant's need for mineral nutrition. The rest is supplied in fertilizers. The plants in new sand-based cranberry plantings depend primarily on fertilizers for their nutrients.
                - paragraph [ref=f13e143]: Nutrient requirements must be met to assure optimum growth and to achieve the yield potential possible for each cultivar. The plant must be healthy, with an adequate root system in order for it to take up the nutrients it needs. Overly saturated or dry soil or soil outside the pH range optimal for cranberries (4.0 to 5.5) can limit yield. Uniform irrigation is essential to maintain moist, but not saturated soil. Pest pressure, frost, or shading are other potential limiting factors. Additional fertilizer applications will not compensate for any of these problems.
                - paragraph [ref=f13e144]: The recommendations in the Chart Book are developed based on knowledge of mineral content in a healthy productive plant. The recommendations focus largely on Nitrogen (N), Potassium (K), and Phosphorus (P). Added nutrients are required to replace minerals removed in the harvested crop and associated leaf trash.
                - list [ref=f13e145]:
                  - listitem [ref=f13e146]: N is found in the highest concentration of all of the nutrient elements in plant tissue, and is removed in the greatest quantity in fruit and harvest detrashing.
                  - listitem [ref=f13e147]: K is found in the highest concentration in cranberry fruit and as a result, K removal in crop harvest is similar to that of N.
                  - listitem [ref=f13e148]: P removal in crop harvest is much less than that of N and K, but research trials support the need for a modest annual addition of P to producing cranberry beds.
                  - listitem [ref=f13e149]: The remaining mineral elements are seldom deficient in plant tissue tests and/or are found in substantial quantity in the bog soil. Their application is primarily recommended when a deficiency exists and not on a routine basis.
                - heading "NITROGEN (N)" [level=2] [ref=f13e150]
                - paragraph [ref=f13e151]: The N fertilizer is not primarily used to produce fruit in the current year, rather it supports the building of the new growth that is the photosynthesis factory to support future production. In our research, current season N applications correlated to current season yield only 10-15% of the time, while in almost all cases applied N correlated significantly with production in the following two years.
                - paragraph [ref=f13e152]: Recommended N fertilizer rates are based on the amount of N removed during harvest (in fruit and in trash). To replace the removed N, we need to apply fertilizer. Plants are not able to take up all the fertilizer applied. The amount of N removed is then multiplied by a correction factor of 1.4 to account for the less than 100% efficiency of fertilizer uptake. The base rates can then adjusted based on seasonal conditions, observed plant growth, previous summer tissue tests, and historic bog responses. The base rate recommendations for N vary by cultivar group. The N concentration in fruit and new growth is similar among the cultivars. The N amount in biomass (fruit and plant material) produced and then lost in harvest operations differs among the groups.
                - paragraph [ref=f13e153]:
                  - strong [ref=f13e154]: "N Lost in Fruit:"
                - list [ref=f13e155]:
                  - listitem [ref=f13e156]:
                    - text: Each 100 bbl of fruit contains
                    - strong [ref=f13e157]: 5.1 lb of N
                    - text: .
                  - listitem [ref=f13e158]: As crop size increases, scale up from the 5.1 lb/100 bbl base based on the total bbl/A produced or expected.
                - paragraph [ref=f13e159]:
                  - strong [ref=f13e160]: "N Lost in Detrashing During Harvest:"
                - list [ref=f13e161]:
                  - listitem [ref=f13e162]: Each acre of Early Black loses 13.4 lb N in plant biomass (in addition to what is removed in the fruit). That amount is likely similar in Howes.
                  - listitem [ref=f13e163]: Larger fruited cultivars are larger plants with bigger leaves, and lose more biomass per acre.
                  - listitem [ref=f13e164]:
                    - text: Ben Lear and first generation hybrids such as Stevens and Grygleski, lose 20.1 lb N per acre.
                    - list [ref=f13e165]:
                      - listitem [ref=f13e166]: 1.5 x Early Black rate to compensate for larger plant size.
                  - listitem [ref=f13e167]:
                    - text: Newer Rutgers and University of Wisconsin hybrids lose 26.8 lb N per acre.
                    - list [ref=f13e168]:
                      - listitem [ref=f13e169]: 2 x Early Black rate to compensate for larger plant size.
                - paragraph [ref=f13e170]: "The base range reflects varying crop loads: up to 600 bbl/A for the newest hybrids and up to 300 bbl/A for the others. This does not mean that higher yields necessarily would require more N. In fact, for all but the newest cultivars, adding more N than required can result in yield decline."
                - table "Recommended base Nitrogen rates" [ref=f13e172]:
                  - caption [ref=f13e173]: Recommended base Nitrogen rates
                  - rowgroup [ref=f13e174]:
                    - row [ref=f13e175]:
                      - columnheader "Cultivar group" [ref=f13e176]
                      - columnheader "Base N rate lb/A" [ref=f13e177]
                      - columnheader "Other considerations" [ref=f13e178]
                  - rowgroup [ref=f13e179]:
                    - row [ref=f13e180]:
                      - 'rowheader "Natives: Early Black and Howes" [ref=f13e181]'
                      - cell "25-40" [ref=f13e182]
                      - cell "Reduce to 25-30 for crops less than 200 bbl/A" [ref=f13e183]
                    - row [ref=f13e184]:
                      - 'rowheader "Older hybrids and large fruit: Ben Lear, Stevens, Grygleski, Pilgrim" [ref=f13e185]'
                      - cell "35-50" [ref=f13e186]
                      - cell "Reduce to 35-40 for crops less than 200 bbl/A" [ref=f13e187]
                    - row [ref=f13e188]:
                      - 'rowheader "Rutgers and University of Wisconsin cultivars: Crimson Queen, Demoranville, Mullica Queen, HyRed" [ref=f13e189]'
                      - cell "50-80" [ref=f13e190]
                      - cell "Reduce to 50-60 for crops less than 300 bbl/A" [ref=f13e191]
                - paragraph [ref=f13e192]: The aim is to provide enough N to produce a stand of uprights with optimal density and length that will support an optimal crop of good quality fruit. When the upright stand is too dense or too long, shading occurs, pollinators may be impeded, and conditions are perfect for fungal rot infections. A thin, stunted stand will not support a large crop since there will not be adequate leaf area, leading to a deficit in photosynthesis and a shortage of carbohydrates for making fruit.
                - paragraph [ref=f13e193]: "Within the recommended rate ranges, previous observed outcomes, tissue test results (see page 85), and observations of the plants color and growth should be used to adjust your rate. Some potential yearly adjustments to the recommendation based on growth and tissue test N:"
                - list [ref=f13e194]:
                  - listitem [ref=f13e195]: If vines are stunted or yellowed and tissue N is low - use more
                  - listitem [ref=f13e196]: If vines are stunted or yellowed and tissue N is high - look for other limiting factors
                  - listitem [ref=f13e197]: If vine growth is adequate and tissue test is in the normal range - continue with the chosen rate
                  - listitem [ref=f13e198]: If vines are rank or leggy and tissue N is low - use less or change timing; vegetative growth is being favored over production
                  - listitem [ref=f13e199]: If vines are rank or leggy and tissue N is high or adequate - use less
                  - listitem [ref=f13e200]: If yield potential is limited by pest damage or frost - use less
                - heading "Length and density of uprights." [level=3] [ref=f13e201]
                - paragraph [ref=f13e202]: "The table below shows adequate stand density and upright length for four common cultivars assessed at hook stage (mid-June). Uprights generally should not be longer than 4 inches. An even and adequate stand of both flowering and vegetative uprights is important, as about 80% of this year’s vegetative uprights will flower next year. 200 flowering uprights/sq. ft., each producing an average of 1 berry, will give a crop of 200-300 bbl/A. To sample upright density: count all uprights in a circle 4 inches in diameter. Total upright density (approximate) for 'Early Black' should be 50/sample; density for 'Howes', 'Ben Lear', or 'Stevens' should be 35/sample. Multiply the amount in the 4-inch diameter cicle by 12 to approximate the number per squre foot."
                - table "Upright density observations at hook stage (mid June)" [ref=f13e204]:
                  - caption [ref=f13e205]: Upright density observations at hook stage (mid June)
                  - rowgroup [ref=f13e206]:
                    - row [ref=f13e207]:
                      - columnheader "Cultivar" [ref=f13e208]
                      - columnheader "Upright density (per sq ft)" [ref=f13e209]
                      - columnheader "Minimum Upright total length (in)" [ref=f13e210]
                  - rowgroup [ref=f13e211]:
                    - row [ref=f13e212]:
                      - rowheader "Early Black" [ref=f13e213]
                      - cell "600" [ref=f13e214]
                      - cell ">2.25" [ref=f13e215]
                    - row [ref=f13e216]:
                      - rowheader "Howes" [ref=f13e217]
                      - cell "400" [ref=f13e218]
                      - cell ">2.25" [ref=f13e219]
                    - row [ref=f13e220]:
                      - rowheader "Ben Lear" [ref=f13e221]
                      - cell "400" [ref=f13e222]
                      - cell ">2.5" [ref=f13e223]
                    - row [ref=f13e224]:
                      - rowheader "Stevens" [ref=f13e225]
                      - cell "400" [ref=f13e226]
                      - cell ">2.5" [ref=f13e227]
                - list [ref=f13e228]:
                  - listitem [ref=f13e229]: Density of total uprights per sq ft, >40% should be flowering
                  - listitem [ref=f13e230]: Upright length above the fruit on a flowering upright should be 1.5 to 2 in.
                - heading "Leaf greenness" [level=3] [ref=f13e231]
                - paragraph [ref=f13e232]: Leaf greenness is related to the pigment chlorophyll that is involved in carbohydrate production through photosynthesis. Along with adequate growth (length) of the uprights, chlorophyll content is an important determinant of yield. Overall intensity and shade of leaf greenness (chlorophyll) is related to adequate N nutrition. With experience, growers can assess intensity of greenness by visual observation. A bog with thin vine cover, pale leaves, or stunted vines may not be getting enough nitrogen. Vines that are too long and too dense have nutritional assets diverted to vegetation and not to fruit (small berries, poor fruit color, increased fruit rot, and inability of bees to reach pollination sites).
                - heading "Nitrogen timing." [level=3] [ref=f13e233]
                - paragraph [ref=f13e234]: Plan nitrogen fertilizer applications based on soil type and soil temperature.
                - list [ref=f13e235]:
                  - listitem [ref=f13e236]: On sandy soils (<1% organic matter), nitrogen fertilizer may be applied throughout the season.
                  - listitem [ref=f13e237]:
                    - text: On more organic cranberry soils and older beds, applications should be based on soil temperatures.
                    - list [ref=f13e238]:
                      - listitem [ref=f13e239]: For typical cranberry bogs (1-4% organic matter), applications of N should not be necessary early in the spring. From flood removal until soil temperatures exceed 55°F, adequate N should be available through biological processes (mineralization; the process by which microbes convert N to plant-available forms).
                      - listitem [ref=f13e240]: Nitrogen is slowly released from the soil early in the spring when the cranberry plants are dormant. This leads to a 'flush' of ammonium availability when the plants are breaking dormancy.
                      - listitem [ref=f13e241]: As soil temperatures increase from 55°F to 70°F, release of N through mineralization is only moderate. Fertilizer applications should be beneficial. This corresponds to the period from roughneck stage through bloom.
                - paragraph [ref=f13e242]: During spells of hot weather, when soil temperatures exceed 70°F and air temperatures exceed 85°F, soil N release increases and crop development slows, so planned fertilizer N applications should be reduced, delayed, or eliminated especially on beds with high organic matter in the soil.
                - paragraph [ref=f13e243]: "It is best to time N applications by the growth stage of the plants. Cranberries primarily use N during three stages: early season leaf production, fruit set, and bud set. When N is applied pre-bloom, it is rapidly taken into the plant and moved to the new leafy growth. While such applications can assure adequate upright length, adding too much N at this stage can lead to excessive growth. Fruit production is a very high demand period that extends from earliest set to about 3 weeks after the final fruit are set. Bud set is occurring during fruit set, so set applications also support this function."
                - paragraph [ref=f13e244]: Since the fruit set window is such a high N demand period, it is not unusual to see some loss of green color in the leaves above the fruit as the fruit are drawing N from both those leaves and the soil. Minor yellowing is normal, severe overall yellowing can indicate inadequate N fertilization. This should not be confused with Yellow Vine (see page 83), a patterned yellowing related to root stress and not improved by the addition of N.
                - table "Nitrogen Application Timing by Stage and Formulation" [ref=f13e246]:
                  - caption [ref=f13e247]: Nitrogen Application Timing by Stage and Formulation
                  - rowgroup [ref=f13e248]:
                    - row [ref=f13e249]:
                      - columnheader "Stage/formulation" [ref=f13e250]
                      - columnheader "% of total N for the season" [ref=f13e251]
                  - rowgroup [ref=f13e252]:
                    - row [ref=f13e253]:
                      - cell "Slow or controlled release" [ref=f13e254]
                    - row [ref=f13e255]:
                      - cell "Pre-roughneck (mid-May)" [ref=f13e256]
                      - cell "50-100%*" [ref=f13e257]
                    - row [ref=f13e258]:
                      - cell "Fast-acting, soluble sources including soil-applied liquids (All but the newest cultivars)" [ref=f13e259]
                    - row [ref=f13e260]:
                      - cell "Roughneck to hook" [ref=f13e261]
                      - cell "up to 20%" [ref=f13e262]
                    - row [ref=f13e263]:
                      - cell "75% in bloom (early set)" [ref=f13e264]
                      - cell "50-60%" [ref=f13e265]
                    - row [ref=f13e266]:
                      - cell "75% out of bloom (late set)" [ref=f13e267]
                      - cell "30-40%" [ref=f13e268]
                    - row [ref=f13e269]:
                      - cell "Fast-acting, soluble sources including soil-applied liquids (Rutgers and U-WI cultivars)" [ref=f13e270]
                    - row [ref=f13e271]:
                      - cell "Roughneck to hook" [ref=f13e272]
                      - cell "up to 20%" [ref=f13e273]
                    - row [ref=f13e274]:
                      - cell "First fruit set" [ref=f13e275]
                      - cell "30-35%" [ref=f13e276]
                    - row [ref=f13e277]:
                      - cell "7 days later" [ref=f13e278]
                      - cell "30-35%" [ref=f13e279]
                    - row [ref=f13e280]:
                      - cell "7 days later" [ref=f13e281]
                      - cell "20-30%" [ref=f13e282]
                    - row [ref=f13e283]:
                      - cell "*if less than 100%, apply remainder at set using fast-acting sources" [ref=f13e284]
                - heading "Nitrogen sources" [level=3] [ref=f13e285]
                - paragraph [ref=f13e286]: Most cranberry growers in MA apply N in NPK fertilizer (aka 'complete fertilizers') primarily to reduce application costs when N, P, and K are all needed. In such fertilizers, the first number on the bag or jug is the percent N in the material. Since P requirements are substantially less than those for N and K, materials with high middle numbers (phosphate) should be avoided. Note that when using liquid fertilizers, the percent on the jug is based on weight, so to calculate pounds per acre applied, one must correct for the liquid density (weight per gallon x gallons per acre x percent).
                - paragraph [ref=f13e287]: The best available evidence indicates that cranberries respond poorly to nitrate N especially in the absence of ammonium N; the AMMONIUM FORM is recommended. Monoammonium phosphate is an excellent source but can provide excess P (see the Phosphorus section below). Ammonium sulfate is also an excellent source. Light rates of urea, a material that breaks down to ammonium, are suitable to correct N deficiencies quickly (when the urea is dissolved and used as a foliar feed). Use blended fertilizers with ammonium N and excellent uniformity of particle size or ammoniated materials. Non-uniform blends may sort during application, giving poor results. Liquid formulations designed to be applied to the soil and taken up through the roots can be substituted for granular materials.
                - paragraph [ref=f13e288]: FISH HYDROLYSATE FERTILIZER is available commercially, is useful for organic production, and has been shown to be a suitable substitute for granular, inorganic NPK. It may provide benefits in soil conditioning and reducing movement of nutrients out of the root zone. Fish fertilizer is a good choice where the bog holds water poorly and/or has a history of needing larger than normal fertilizer rates. The nitrogen in fish fertilizer is tied up in organic compounds. As these degrade in the soil, nitrogen is slowly released for use by the cranberry plants. Leaching losses of nitrogen are reduced. Therefore, 20% lower nitrogen rates provided as fish fertilizer should give the same result as a higher nitrogen rate provided in granular, inorganic fertilizer. This has been demonstrated on commercial bogs. Fish is especially useful in the spring and can be incorporated into a program that includes other inorganic fertilizers if organic production methods are not required.
                - heading "PHOSPHORUS (P)" [level=2] [ref=f13e289]
                - paragraph [ref=f13e290]:
                  - strong [ref=f13e291]: PHOSPHORUS (P) RATES OF 10 LB/A (20 LB/A P2O5) OR LESS ARE STRONGLY RECOMMENDED ON NATIVE OR FIRST-GENERATION HYBRID VARIETIES UNLESS A DEFICIENCY IS DOCUMENTED.
                - paragraph [ref=f13e292]: Phosphorus is important for plant metabolism; it plays a key role in energy transfers, in transporting the sugars produced in photosynthesis, and is part of the DNA molecule. If P is deficient, growth and yield can be impacted. However, P does build up in the upper soil layers and some of that is available to the plants. This stratification often confounds P soil test results, making them difficult to interpret. Therefore, application recommendations are based on crop use and tissue testing. Of the three main nutrients, P is required in the smallest amount (compared to N and K). P removed during harvest accounts for only about 5 lb/A (250 bbl/A contains approximately 2.5 lb P and normal harvest and subsequent detrashing removes another 2.5 lb). Pruning operations can also remove P; 500 lb of vine prunings contain about 1/2 lb P.
                - paragraph [ref=f13e293]:
                  - text: P is often added with N in NPK fertilizers and is the second number on the bag. Fertilizer convention is such that the second number is actually percent
                  - emphasis [ref=f13e294]: phosphate
                  - text: (P2O5), so to calculate the actual P, that number is multiplied by
                  - emphasis [ref=f13e295]: "0.44"
                  - text: .
                - heading "Important considerations regarding P use and use reduction:" [level=3] [ref=f13e296]
                - paragraph [ref=f13e297]: Very little P is removed from the bog in the harvested crop! Cranberries require additions of phosphorus fertilizer for sustained productivity, but there is no evidence that more than 20 lb/A actual P is required for productive cranberries (for native cultivars and first generation hybrids).
                - paragraph [ref=f13e298]: "Research studies on P have shown:"
                - list [ref=f13e299]:
                  - listitem [ref=f13e300]: On high P sand soils, there was no response to P fertilizer on beds with adequate tissue P.
                  - listitem [ref=f13e301]: On native cultivars, the greatest yields were on plots receiving 10-15 lb/A P, with no improvement at higher rates.
                  - listitem [ref=f13e302]: If tissue P was in the sufficient range, rates well below 10 lb/A gave the best yields.
                  - listitem [ref=f13e303]: If tissue P was in the deficient range, 20 lb/A gave the best yield.
                  - listitem [ref=f13e304]: At several commercial sites, growers applying an average of 10 or less lb/A/yr P over a period of years have seen either no change or an improvement in their crops.
                - paragraph [ref=f13e305]: Based on these data and observations, the P rate recommendations in this Chart Book were developed. The only exception to these recommendations for native varieties and first-generation hybrids are for new beds with fresh sand planting medium. The recommendation for those is to use up to 20 lb/A at planting and no more than a total of 30 lb/A on new or renovated beds until the canopy is established.
                - paragraph [ref=f13e306]: Second generation hybrids produce much higher yields than native varieties and first generation hybrids, and tend to be larger and more robust plants. These varieties are reported to have moderately higher P demands than older varieties. On-going research is being conducted to quantify the increased nutrient demands.
                - paragraph [ref=f13e307]: P can be an environmental pollutant. Adverse environmental impacts are reduced by using moderate P rates (no more than 20 lb/A per season on native varieties) and by careful attention to harvest flood management. When bogs are flooded, especially when soil and water are warm, P from the soil can move into the flood water. When the flood is released, the dissolved P then leaves the bog system.
                - paragraph [ref=f13e308]: "To minimize P release in harvest floods:"
                - list [ref=f13e309]:
                  - listitem [ref=f13e310]: Hold harvest floods for 2-4 days to allow settling of P-containing particles.
                  - listitem [ref=f13e311]: Release gradually (to avoid flushing particles) so that discharge is completed within 10 days. Research has shown that holding floods beyond 10-12 days in the fall can result in oxygen depletion and release of P from iron in the soil.
                  - listitem [ref=f13e312]: Use no more than 20 lb/A P in fertilizer -- laboratory research showed that with higher P use, P movement into the flood begins immediately upon flooding and then accelerates as oxygen depletes. With low to moderate P use, P release into water is minimized.
                - table "Recommended Phosphorus rates for native and first generation hybrid varieties" [ref=f13e314]:
                  - caption [ref=f13e315]: Recommended Phosphorus rates for native and first generation hybrid varieties
                  - rowgroup [ref=f13e316]:
                    - row [ref=f13e317]:
                      - columnheader "Production system" [ref=f13e318]
                      - columnheader "Recommended P rate lb/A" [ref=f13e319]
                      - columnheader "as P2O5 lb/A" [ref=f13e320]
                      - columnheader "Notes" [ref=f13e321]
                  - rowgroup [ref=f13e322]:
                    - row [ref=f13e323]:
                      - rowheader "New plantings" [ref=f13e324]
                      - cell "up to 30" [ref=f13e325]
                      - cell "up to 68" [ref=f13e326]
                      - cell "During establishment" [ref=f13e327]
                    - row [ref=f13e328]:
                      - rowheader "Established beds, tissue test >0.16%" [ref=f13e329]
                      - cell "no more than 10" [ref=f13e330]
                      - cell "no more than 23" [ref=f13e331]
                      - cell [ref=f13e332]
                    - row [ref=f13e333]:
                      - rowheader "Established beds, tissue test 0.11-0.15% and stable" [ref=f13e334]
                      - cell "no more than 15" [ref=f13e335]
                      - cell "no more than 34" [ref=f13e336]
                      - cell "Trying a lower rate (e.g. 10 lb/A) is encouraged" [ref=f13e337]
                    - row [ref=f13e338]:
                      - rowheader "Established beds, tissue test <0.12% and trending down" [ref=f13e339]
                      - cell "up to 20" [ref=f13e340]
                      - cell "up to 45" [ref=f13e341]
                      - cell "15 lb/A P with testing should suffice" [ref=f13e342]
                    - row [ref=f13e343]:
                      - rowheader "Established beds, tissue test <0.10%" [ref=f13e344]
                      - cell "20" [ref=f13e345]
                      - cell "45" [ref=f13e346]
                      - cell [ref=f13e347]
                - paragraph [ref=f13e348]: "Research on Stevens, Ben Lear or native cultivars showed 10-15 lb/A P is sufficient to maintain productivity if tissue test P is in the sufficient range (0.1-0.2%). In plots and demonstration sites, production and fruit quality were maintained with an average of 10 lb/A; no significant relationship between P rate and yield was observed. As P fertilizer use was reduced, P output from the bog (in flood water) also decreased. Based on these studies, growers have reduced P applications well below the previously recommended maximum of 20 lb/A (5-year rolling average of ~10 lb/A) with no reduction in crop. When implementing a reduced P rate, it is important to collect August tissue tests and follow these recommendations: If P is <0.10% - increase the P rate and retest next season; if P is 0.10-0.11% - maintain the P rate and retest next season; if P is 0.12-0.15% - maintain the reduced P rate and retest in 2-3 years; if P is 0.16% or more - further P reduction should be considered."
                - paragraph [ref=f13e349]: These numbers above are based on Stevens, Ben Lear or native cultivars. Recently MA cranberry growers have adopted high-yielding second-generation hybrids. There is evidence that more P is being removed through harvest as yields of over 400 barrels per acre have been reported. To replenish P available for plant uptake slightly higher lb P/A may be required with the second-generation hybrids. It is suggested that up to 30 lb P/acre could be adequate. Ongoing research continues to quantify nutrient demands for these varieties.
                - heading "Phosphorus timing and sources." [level=3] [ref=f13e350]
                - paragraph [ref=f13e351]:
                  - text: Phosphorus ties up in the soil quickly, binding to iron and aluminum. Therefore, P should only be applied when the plants are actively growing. Phosphorus is generally added with nitrogen and potassium (NPK) or as super phosphate (0-25-0) or triple super phosphate (0-45-0). Research indicates that foliar P or soil-applied liquid fertilizer that contains P, bone meal, or rock phosphate can supply the P needs of cranberry bogs as well. The second number on the bag of NPK fertilizer is phosphate - P
                  - subscript [ref=f13e352]: "2"
                  - text: O
                  - subscript [ref=f13e353]: "5"
                  - text: .
                - paragraph [ref=f13e354]:
                  - emphasis [ref=f13e355]: "* To determine pounds of P in 100 pounds of fertilizer, multiply 0.44 by the second number on the fertilizer label."
                - paragraph [ref=f13e356]:
                  - text: When choosing fertilizers, remember that research indicates there is
                  - strong [ref=f13e357]: no horticultural benefit
                  - text: to high P rates (in excess of 20 lb/A actual P per season) and that high P applications can be associated with degradation in water quality. If tissue P is in the sufficient range, we do not recommend fertilizers with high P (middle bag number). In fact, excellent results have been seen in recent years with 1:1 or near 2:1 N:P ratios (for example, 18-8-18).
                  - strong [ref=f13e358]: It is highly recommended that growers use reduced P ratio fertilizer on their bogs, especially if high N applications are planned.
                - paragraph [ref=f13e359]:
                  - strong [ref=f13e360]: Use no more than 20 lb/A actual P (~45 lb/A P2O5) per season except on new beds or second-generation hybrids. See calculations on the last page of the Nutrition section.
                - heading "POTASSIUM (K)" [level=2] [ref=f13e361]
                - paragraph [ref=f13e362]: The amount of K in cranberry leaves is second only to nitrogen among the mineral nutrients and K is the element in the greatest abundance in the fruit. Potassium is important in the movement of sugars in the plant, in maintaining plant hydration, and in many enzyme reactions in the plant. Cranberry sand soils are naturally low in K, leading to an annual requirement for K additions.
                - heading "Potassium rates." [level=3] [ref=f13e363]
                - paragraph [ref=f13e364]: K is often added with N in NPK fertilizers and is the third number on the bag. Fertilizer convention is such that the third number is actually percent potassium oxide (K2O), so to calculate the actual K, that number is multiplied by 0.83. When tissue and soil tests are in the sufficient range, the K requirement is roughly similar to that for N, so choosing an NPK with similar first and third numbers works well.
                - table "Recommended Potassium rates" [ref=f13e366]:
                  - caption [ref=f13e367]: Recommended Potassium rates
                  - rowgroup [ref=f13e368]:
                    - row [ref=f13e369]:
                      - columnheader "Soil and tissue test level" [ref=f13e370]
                      - columnheader "Recommended K rate lb/A" [ref=f13e371]
                      - columnheader "Other considerations" [ref=f13e372]
                  - rowgroup [ref=f13e373]:
                    - row [ref=f13e374]:
                      - rowheader "normal" [ref=f13e375]
                      - cell "up to 100" [ref=f13e376]
                      - cell "Look for NPK with similar first and third numbers" [ref=f13e377]
                    - row [ref=f13e378]:
                      - rowheader "low" [ref=f13e379]
                      - cell "60-100" [ref=f13e380]
                      - cell "Consider a supplement like SulPoMag or KMag at 100-150 lb/A or a soil-applied liquid K supplement" [ref=f13e381]
                    - row [ref=f13e382]:
                      - rowheader "high" [ref=f13e383]
                      - cell "0-60" [ref=f13e384]
                      - cell "Use no supplements" [ref=f13e385]
                - heading "Potassium timing and sources." [level=3] [ref=f13e386]
                - paragraph [ref=f13e387]: Supplemental K may be applied as soon as the soil warms in the spring, generally in early May. Otherwise, K is generally added with nitrogen and phosphorus (NPK).
                - paragraph [ref=f13e388]: Supplemental K is often added with magnesium (SulPoMag or similar product), but may be applied as a foliar spray (of little value in research trials) or as potassium sulfate (0-0-50). Muriate of potash (KCl, potassium chloride, 0-0-60) may be less desirable due to the adverse effects of chloride on cranberry vines when used at high rates over years. However, modest rates appear to have no adverse impact. While foliar applied K seems to have little utility in cranberry production, soil-applied liquid products containing K have been used with good results.
                - heading "OTHER ELEMENTS" [level=2] [ref=f13e389]
                - heading "Calcium and Magnesium." [level=3] [ref=f13e390]
                - paragraph [ref=f13e391]: The other major elements, Calcium (Ca) and Magnesium (Mg) are seldom lacking in cranberries. However, Mg is often added with K in SulPoMag or KMag. On bogs with Yellow Vine (see below), magnesium sulfate (Epsom salts) may alleviate symptoms. Diagnosed deficiencies (using tissue tests) of Mg or Ca may be treated with 30 lb/A of the deficient element in granular form applied in the spring or with liquid supplements pre-bloom.
                - paragraph [ref=f13e392]: Soil balance of K, Mg, and Ca is important. Excessive use of any one can induce deficiency of the others. This is especially a risk with large soil applications of Ca. Lime can have adverse effects by changing soil pH and is not recommended for use in cranberry production. Products that supply Ca may improve fruit quality or firmness. Examples of Ca supplements suitable for cranberry include those that are gypsum based (gypsum and some formulations of Solu-Cal) and liquid supplements such as Full Measure CAL 30TM (this material increased Ca concentration in cranberry fruit in research trials).
                - paragraph [ref=f13e393]:
                  - strong [ref=f13e394]: Yellow vine (YV)
                  - text: manifests as an apparent nutrient deficiency. Beginning with older leaves, yellowing presents along leaf margins and between the veins on the leaf, leaving green only along the veins. Tissue tests of such leaves often show higher than standard potassium and low-normal magnesium. However, extensive investigation has shown that the nutrient imbalance is secondary to the primary problem – root insufficiency due to too much or too little moisture. Cranberry bogs with patches of YV were found to have soil water content (in the YV areas) that was either much higher or much lower than that in the surrounding green areas. Additionally, in greenhouse experiments, plants subjected to very shallow or very deep water table conditions developed YV. The consistent finding in the field has been that the rooting depth in YV areas is shallower than that in unaffected areas. In most cases, YV appears in areas that were too wet early in the season leading to poor rooting depth. Rooting depth can be improved by keeping the bed well drained early in the season. When the water table is closer than about 6 inches below the surface, root development and root function is impaired. Examine your drainage and irrigation practices if you see YV on your bog. Another symptom of poor drainage is high manganese (Mn) in the tissue test. YV usually appears as temperature and water stress increase during mid-summer and may be more severe if Casoron has been used since it can affect rooting and root function.
                - heading "Minor elements." [level=3] [ref=f13e395]
                - list [ref=f13e396]:
                  - listitem [ref=f13e397]: Minor element deficiencies are rare in cranberries due to low requirements and high availability in acid soils. Deficiencies may be brought on by mineral imbalances or stress conditions (drought, waterlogging).
                  - listitem [ref=f13e398]: If deficiencies are suspected (visual symptoms), confirm with tissue testing. If confirmed, deficiencies are best corrected with foliar sprays. Such sprays are applied between bud break and hook stage.
                  - listitem [ref=f13e399]: CALCIUM-BORON (5% Ca, 0.5% B, no other minor elements) sprays were the only minor element supplements to give increased crops in our research on non-deficient bogs. Response was greatest on bogs yielding at or below 150 bbl/A. We found that 2 applications of 2 qt/A improved fruit set.
                - paragraph [ref=f13e400]:
                  - strong [ref=f13e401]: TIMING
                  - text: ": 10% bloom, mid-bloom. The second application seems most effective. Application by sprayer is more effective than sprinkler application. This is a foliar feed - apply accordingly; do not wash off the leaves."
                - paragraph [ref=f13e402]:
                  - strong [ref=f13e403]: CAUTIONS
                  - text: ": 1. Manganese-containing fertilizers or fungicides (Mancozeb group) may cancel any beneficial effect of CaB if applied with or around the same time as CaB.2. DO NOT use when leaf analysis is above 75 ppm B.3. If B levels are elevated, but below 75 ppm, eliminate the FIRST application."
                - heading "APPLYING FERTILIZER TO CRANBERRY BOGS" [level=2] [ref=f13e404]
                - list [ref=f13e405]:
                  - listitem [ref=f13e406]: SPRINKLER SYSTEMS may be used to apply liquids, flowables, and foliar feeds. Make sure not to mix incompatible materials (jar test first). When using sprinkler systems to apply fertilizer - make sure that coverage is ADEQUATE AND UNIFORM. EVERY EFFORT SHOULD BE MADE TO PRESERVE WATER QUALITY - avoid application of fertilizer to water in ditches and canals.
                  - listitem [ref=f13e407]: Foliar feeds should not be washed off the leaves. Liquid fertilizers should be washed onto the soil. Be sure that you know which you are applying. Liquid products that have recently been integrated into cranberry management in Massachusetts are primarily designed to be soil-applied and watered in.
                  - listitem [ref=f13e408]: FISH FERTILIZER is a liquid fertilizer. It should be washed in.
                  - listitem [ref=f13e409]: Make sure ground application equipment is properly calibrated.
                - heading "SOIL pH" [level=3] [ref=f13e410]
                - paragraph [ref=f13e411]:
                  - text: The optimal pH for cranberry soil is between 4.0 and 5.5. Use of sulfate containing fertilizers (SulPoMag, ammonium sulfate) does not affect soil pH. However, acid is released into the soil as the plants take up ammonium N. Otherwise, to substantially lower soil pH, elemental sulfur (S) application is used. Soil pH may influence the types of weeds that invade a bog. See the Weed Management section for information on the use of sulfur for weed suppression. Prior to making S applications, seek advice from Extension specialists or consultants. Apply no more than 500 lb/A/season in one or two applications.
                  - strong [ref=f13e412]: Apply elemental S only to well drained soils and test soil pH prior to application.
                - paragraph [ref=f13e413]: Use this table (courtesy of the Wisconsin Cranberry Crop Management Newsletter) to calculate the amount of S needed to lower soil pH based on desired amount of change and soil organic matter content from the soil test. This is a SLOW process depending on bacterial activity in the soil - pH change will occur over a period of months. Change will be fastest when soil is warm.
                - table "Sulfur Application Rates (lb/A) to Achieve Desired pH Change Based on Soil Organic Matter Content" [ref=f13e415]:
                  - caption [ref=f13e416]: Sulfur Application Rates (lb/A) to Achieve Desired pH Change Based on Soil Organic Matter Content
