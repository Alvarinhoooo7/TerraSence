; Configuración de PlatformIO para el firmware TerraSense.
;
; La misma carpeta sirve para Arduino IDE y PlatformIO: src_dir = . compila los
; archivos donde están, sin moverlos a src/.
;
; La plataforma oficial "espressif32" trae el núcleo Arduino-ESP32 2.x, y este
; firmware usa APIs del 3.x (ledcAttach, BLE con String). Por eso se usa
; pioarduino, fijado al núcleo 3.3.0, el mismo con que se probó en Arduino IDE.

[platformio]
src_dir = .
default_envs = esp32dev

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = direct
