name: Deploy to Lightsail

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    # environment: develop
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEV_AWS_LIGHTSAIL_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -t rsa ${{ secrets.DEV_AWS_LIGHTSAIL_STATIC_IP }} >> ~/.ssh/known_hosts

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.DEV_AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.DEV_AWS_REGION }}

      - name: Retrieve secrets from AWS Secrets Manager
        uses: aws-actions/aws-secretsmanager-get-secrets@v1
        with:
          secret-ids: |
            ${{ secrets.DEV_AWS_SM_KEYCHAIN_NAME }}
          parse-json-secrets: true

      - name: Retrieve and format environment variables
        shell: bash
        run: |
          string=${{ secrets.DEV_AWS_SM_KEYCHAIN_NAME }}
          transformed_string=$(echo "$string" | tr '[:lower:]' '[:upper:]' | tr '/' '_')
          env_vars=$(env | grep -E "^$transformed_string")
          env_vars=$(echo "$env_vars" | sed "s/$transformed_string\_//g")
          echo "$env_vars" > $GITHUB_WORKSPACE/env_vars.txt

      - name: Print env_vars.txt
        run: cat $GITHUB_WORKSPACE/env_vars.txt

      - name: Deploy to Lightsail
        run: |
          ssh -i ~/.ssh/id_rsa admin@${{ secrets.DEV_AWS_LIGHTSAIL_STATIC_IP }} "cd $(basename ${GITHUB_WORKSPACE}) \
          && git config --global credential.helper store \
          && echo 'https://$GITHUB_ACTOR:$GITHUB_TOKEN@github.com' > ~/.git-credentials \
          && git pull origin develop\
          && export NVM_DIR=~/.nvm \
          && source ~/.nvm/nvm.sh \
          && npm i \
          && if pm2 list | grep -q 'No processes found'; then echo 'No PM2 processes to delete'; else pm2 delete all; fi \
          && rm -r ./build \
          && tsc \
          && env $(cat $GITHUB_WORKSPACE/env_vars.txt | xargs) pm2 start pm2.config.js --log-date-format 'DD-MM HH:mm:ss' \
          && pm2 save"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}