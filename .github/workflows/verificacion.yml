name: Verificación

# Las comprobaciones de CLAUDE.md §6, más los dos guardianes que no se pueden
# deducir leyendo el código: que ningún archivo generado se haya editado a mano
# y que el informe entregable no nombre el repositorio.
#
# Cada trabajo es independiente a propósito: así una falla dice de inmediato si
# el problema está en las cifras, en la documentación, en la app o en la web.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verificacion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finanzas:
    name: Modelo financiero y archivos generados
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: finanzas/requirements.txt
      - run: pip install -r finanzas/requirements.txt
      - name: Pruebas del modelo
        run: python -m unittest discover -s finanzas -p "test_*.py"
      - name: Regenerar cifras, planillas y bloques de informe
        run: python finanzas/modelo.py
      - name: Los archivos generados coinciden con sus fuentes
        # Si este paso falla, alguien editó a mano una salida de modelo.py o
        # cambió supuestos.json sin regenerar. Las planillas quedan fuera porque
        # xlsxwriter les graba la hora de creación: su diferencia no dice nada.
        run: git diff --exit-code -- . ':(exclude)*.xlsx'
      - name: Rótulos, índices y referencias del informe 2
        run: python finanzas/verificar_informe_e2.py

  documentacion:
    name: Documentación y entregable
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Enlaces locales y diagramas Mermaid
        run: python docs/verificar_documentacion.py
      - name: El entregable se lee sin acceso al repositorio
        # El informe que se entrega y su versión corregida deben leerse sin el
        # repositorio a la vista: ni rutas, ni nombres de script, ni comandos,
        # ni identificadores de código. Las URL de la bibliografía y los
        # comentarios HTML de archivo generado no cuentan.
        run: |
          python - <<'PY'
          import io
          import re
          import sys

          ENTREGABLES = [
              'Evaluacion/Evaluacion 1/INFORME 1 CORREGIDO.md',
              'Evaluacion/Evaluacion 2/INFORME 2.md',
          ]
          PROHIBIDO = re.compile(
              r'(finanzas|supabase|docs|Firmware|PCB|App|Web)/'
              r'|\.(py|ts|tsx|mjs|sql|ino|yml|toml)\b'
              r'|\b(python|npm|pip|node|git|supabase) \S'
              r'|`'
          )
          URL = re.compile(r'https?://\S+')
          COMENTARIO = re.compile(r'<!--.*?-->', re.S)

          fallas = []
          for ruta in ENTREGABLES:
              texto = COMENTARIO.sub('', io.open(ruta, encoding='utf-8').read())
              for numero, linea in enumerate(texto.splitlines(), 1):
                  encontrado = PROHIBIDO.search(URL.sub('', linea))
                  if encontrado:
                      fallas.append(f'{ruta}:{numero}: {encontrado.group(0)!r} en: {linea.strip()[:90]}')

          for falla in fallas:
              print(falla)
          plural = '' if len(fallas) == 1 else 's'
          print(f'{len(ENTREGABLES)} entregables revisados; {len(fallas)} referencia{plural} al repositorio.')
          sys.exit(1 if fallas else 0)
          PY

  app:
    name: Pruebas de la app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: App/package-lock.json
      - run: npm ci
        working-directory: App
      - run: npm test
        working-directory: App

  web:
    name: Pruebas, tipos y construcción del backoffice
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run type-check
      - run: npm run build
      - name: Las utilidades de color del tema generan CSS
        # Tailwind v4 sólo emite las clases que encuentra en el código, así que
        # esto necesita el CSS que acaba de construir el paso anterior.
        run: node scripts/verificar-clases.mjs
