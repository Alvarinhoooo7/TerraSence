<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#071512" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f7f5" media="(prefers-color-scheme: light)" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="Backoffice de soporte técnico de TerraSense: flota de sondas, membresías, firmware y telemetría."
    />
    <title>TerraSense · Backoffice de Soporte</title>
    <script>
      // Fija el tema antes del primer pintado. Si React lo aplicara desde el
      // efecto de ThemeProvider, una sesión en claro vería un destello oscuro
      // en cada carga, porque el documento arranca con data-theme="dark".
      try {
        var t = localStorage.getItem('terra-theme');
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        /* Almacenamiento no disponible: se queda con el oscuro del atributo. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
