                  - paragraph [ref=f14e114]: Warm weather has affected the agricultural community across the board, whether producers are growing row crops or pecans. Fortunately, there has been some relief where recent rainfall predictions have materialized, providing much-needed moisture. Earlier this month, some pecan growers applied imidacloprid to manage phylloxera galls. By now, the results of those applications should be visible,…
