                - cell "‡" [ref=e160]
                - cell "Restricted entry interval (REI) is the number of hours (unless otherwise noted) from treatment until the treated area can be safely entered without protective clothing. Preharvest interval (PHI) is the number of days from treatment to harvest. In some cases the REI exceeds the PHI. The longer of two intervals is the minimum time that must elapse before harvest." [ref=e161]
              - row [ref=e162]:
                - cell [ref=e163]:
                  - superscript [ref=e164]: "1"
                - cell [ref=e165]:
                  - text: Group numbers are assigned by the
                  - link "Fungicide Resistance Action Committee (FRAC)" [ref=e166] [cursor=pointer]:
                    - /url: http://www.frac.info/
                  - text: according to different modes of actions. Fungicides with a different group number are suitable to alternate in a resistance management program. In California, make no more than one application of fungicides with mode of action Group numbers 1, 4, 9, 11, or 17 before rotating to a fungicide with a different mode of action Group number; for fungicides with other Group numbers, make no more than two consecutive applications before rotating to a fungicide with a different mode of action Group number.
