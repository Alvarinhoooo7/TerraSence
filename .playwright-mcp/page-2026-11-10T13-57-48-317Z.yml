        - heading "Acknowledgements" [level=2] [ref=f19e103]
        - paragraph [ref=f19e104]: The editors gratefully acknowledge the reviewers of the second edition of publication (Mark Colbert, Fred Davies, Hugh English, John Jackson, Chris Oswalt, Mark Ritenour, Steve Smith, Jerry Southwell, Jack Zorn, and all contributing authors) for their time, effort, and suggestions for improvement. The editors are also grateful to the contributions of the reviewers of the third edition, including Dr. Tripti Vashisth, Ms. Laurie Hurner, and Mr. Chris Oswalt.
