      - article [ref=e64]:
        - generic [ref=e65]:
          - heading "Factors Affecting Soil pH" [level=2] [ref=e66]
          - list [ref=e67]:
            - listitem [ref=e68]: Irrigation with high-pH or saline water can cause a gradual increase in soil pH. It is strongly recommended that an irrigation water-quality (pH and salinity) test be done yearly.
            - listitem [ref=e69]: Water drawn from the limestone aquifer is high in bicarbonates and has a liming effect on the soil.
            - listitem [ref=e70]: Numerous soil amendments, including composts, contain nutrient value and may also have a liming effect resulting in unintended increase in soil pH.
        - generic [ref=e71]:
          - heading "Concern about Soil pH" [level=2] [ref=e72]
          - list [ref=e73]:
            - listitem [ref=e74]: Soil pH determines the solubility and bioavailability of nutrients essential for citrus growth and yield.
            - listitem [ref=e75]: Research has determined that adjusting soil pH from greater than 7 to the range between 6 to 6.5 increases availability of potassium (K), phosphorus (P), calcium (Ca), manganese (Mn), zinc (Zn) and iron (Fe), improving citrus growth and yield.
            - listitem [ref=e76]: Ferrous iron found in slightly acid soils is the form available to most plant species, but ferric iron in high-pH soils is not. Thus, citrus grown on high-pH soils will be iron-deficient.
            - listitem [ref=e77]: When soil pH reaches 5 or lower, aluminum (Al), Fe, Mn, and/or Zn solubility increase in the soil solution and can become toxic to most citrus.
        - generic [ref=e78]:
          - heading "Management Options" [level=2] [ref=e79]
          - list [ref=e80]:
            - listitem [ref=e81]: Management of soil pH and nutrients should include annual soil sampling. Water samples should be taken if elevated soil pH is reported.
            - listitem [ref=e82]: Irrigation water acidification, elemental sulfur application, or use of acidifying fertilizers are recommended to reduce soil pH to the acceptable range.
            - listitem [ref=e83]: Injection of acids into irrigation water high in bicarbonates will reduce soil solution pH, removing soil bicarbonates.
            - listitem [ref=e84]: The current recommendation is to lower irrigation water to a pH between 5 and 6. Soil pH will decrease over time depending on soil buffering capacity and bicarbonate concentration.
            - listitem [ref=e85]: The time required to obtain optimum soil pH (6–6.5) can be 6 to 24 months depending on the soil buffer capacity, moisture, temperature, and aeration.
            - listitem [ref=e86]: In certain cases, elemental sulfur (S) may be applied to the soil. Over time, the soil bacteria will convert the elemental S form into the sulfate form. Sulfuric acid is released in the process, neutralizing hydroxides and bicarbonates.
            - listitem [ref=e87]: Acid-forming fertilizers are positively charged nutrients, such as ammoniacal-N, K, Ca, and Mg, that lower root zone pH after being absorbed by plants.
            - listitem [ref=e88]: Long-term use of ammoniacal fertilizers will also result in lowering the pH by nitrification .
            - listitem [ref=e89]: Sulfate, nitrate, or phosphate ions in fertilizers do not cause soil pH decrease.
        - generic [ref=e90]:
          - heading "pH Test Equipment" [level=2] [ref=e91]
          - heading "Effect of Soil pH on Nutrient Management" [level=3] [ref=e92]
          - list [ref=e93]:
            - listitem [ref=e94]:
              - text: High soil pH (greater than 7.2) causes NH
              - subscript [ref=e95]: "3"
              - text: volatilization from fertilized soils with ammoniacal-N sources, such as ammonium sulfate, or ammonium-forming fertilizers, such as urea.
            - listitem [ref=e96]: Low soil pH exacerbates nutrient-leaching problems because positively charged nutrients such as ammonium, calcium, magnesium, and potassium adsorbed by soil particles may be replaced by hydrogen protons.
            - listitem [ref=e97]: Nutrient leaching out of the root zone reduces citrus nutrient uptake.
            - listitem [ref=e98]: Caution is recommended to avoid soil pH lower than 5.0.
          - 'figure "Figure 1. Avoid soil pH lower than 5.0. Credit: Tonya R. Weeks, UF/IFAS" [ref=e100]':
            - img "Photograph of a Thermo Scientific digital thermometer displaying a temperature reading of 40.2°C with a probe connected. Device is placed on a dark surface with visible cables and a metallic object in the background." [ref=e101]
          - paragraph [ref=e103]
          - 'figure "Figure 2. Effect of soil pH on nutrient availability as expressed by relative bar width. Credit: Nutrition of Florida Citrus Trees. 2nd Edition. T. A. Obreza and K. T. Morgan" [ref=e105]':
            - img "Effect of soil pH on nutrient availability as expressed by relative bar width." [ref=e106]
