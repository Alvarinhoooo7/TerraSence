                      - cell "* = As high as 1.3 % has been seen for Stevens, but monitor growth closely if N is > 1.1 %." [ref=f13e513]
                - table "Minor Element Concentration in Dried Tissue (ppm)" [ref=f13e515]:
                  - caption [ref=f13e516]: Minor Element Concentration in Dried Tissue (ppm)
                  - rowgroup [ref=f13e517]:
                    - row [ref=f13e518]:
                      - columnheader "Minor Element" [ref=f13e519]
                      - columnheader "Concentration in dried tissue (ppm)" [ref=f13e520]
                  - rowgroup [ref=f13e521]:
                    - row [ref=f13e522]:
                      - rowheader "Boron (B)" [ref=f13e523]
                      - cell "15-60" [ref=f13e524]
                    - row [ref=f13e525]:
                      - rowheader "Zinc (Zn)" [ref=f13e526]
                      - cell "15-30" [ref=f13e527]
                    - row [ref=f13e528]:
                      - rowheader "Copper (Cu)" [ref=f13e529]
                      - cell "4-10" [ref=f13e530]
                    - row [ref=f13e531]:
